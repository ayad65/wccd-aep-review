<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WCCD AEP – test D1</title>
  <!--
    Feasibility test D1 (11 Nov 2026): our own inputs and layout, running the Map Viewer form's own rules.
    THIS PAGE CANNOT SAVE: it contains no save code. TEST records only; Campbell is refused.
    ArcGIS Maps SDK for JavaScript pinned to 5.1. Components only, no SDK widgets.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    :root { --ink:#1A1D21; --muted:#4A525B; --line:#C9CED4; --soft:#E3E6EA; --bg:#F4F5F6; --blue:#17457A; --blue-bg:#E6EEF7; --red:#8A1515; --red-bg:#FBE4E4; --amber-bg:#FCE9CF; --amber:#5E3A00; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: Inter, system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg); font-variant-numeric: tabular-nums; font-size: 14px; }
    h1, h2 { font-family: "Space Grotesk", Inter, sans-serif; margin: 0; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px 24px 48px; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
    header h1 { font-size: 22px; } header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .util { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
    .util button { border: 0; background: none; color: var(--blue); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; min-height: 32px; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; }
    .bar label { font-weight: 600; display: flex; align-items: center; gap: 8px; }
    select, input[type="text"], input[type="number"], input[type="date"], input[type="datetime-local"], textarea {
      min-height: 44px; padding: 8px 12px; border: 1px solid #6B747E; border-radius: 4px; font: inherit; background: #fff; color: var(--ink); width: 100%; max-width: 100%; }
    .bar select { width: auto; }
    textarea { min-height: 72px; }
    :disabled { background: var(--soft) !important; color: #2B3138; }
    .notice { background: var(--blue-bg); color: #0E2C50; border: 1px solid var(--blue); border-radius: 4px; padding: 10px 14px; }
    .error { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); border-radius: 4px; padding: 10px 14px; font-weight: 600; white-space: pre-wrap; }
    .ok { background: #E3F1E6; color: #1E4D2B; border: 1px solid #1E4D2B; border-radius: 4px; padding: 10px 14px; font-weight: 600; }
    .warn { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber); border-radius: 4px; padding: 10px 14px; white-space: pre-wrap; }
    .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
    .card.tint { background: #F1F5FA; border-color: #B9CBE0; }
    .card > h2 { font-family: inherit; font-size: 15px; padding: 12px 14px; border-bottom: 1px solid var(--soft); }
    .card > div { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
    .fld > label, .fld > .lab { display: block; font-weight: 600; margin-bottom: 4px; }
    .fld .req { color: var(--red); }
    .fld small { display: block; color: var(--muted); margin-top: 4px; }
    .fld .calc { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 6px; }
    .opts { display: flex; flex-direction: column; }
    .opts label { display: flex; align-items: center; gap: 8px; min-height: 36px; font-weight: 400; }
    .opts input, .sw input { width: 20px; height: 20px; }
    .sw { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .info { background: var(--bg); border-left: 4px solid var(--blue); padding: 8px 12px; border-radius: 0 4px 4px 0; overflow-wrap: anywhere; }
    .missing { border-color: var(--red) !important; outline: 1px solid var(--red); }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, Consolas, monospace; }
    details.blk { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 0 14px; }
    details.blk[open] { padding-bottom: 14px; }
    details.blk > summary { cursor: pointer; min-height: 44px; padding: 12px 0; font-weight: 700; }
    arcgis-feature-form { display: block; max-width: 100%; overflow-x: hidden; overflow-wrap: anywhere; border: 1px solid var(--line); }
    .btn { min-height: 44px; padding: 0 16px; border: 1px solid #6B747E; border-radius: 4px; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #own.running .info, #own.running .calcfld { opacity: .5; }
    @media (max-width: 800px) { .cols { grid-template-columns: minmax(0, 1fr); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Test D1 – our layout, the form's rules</h1><p>This page cannot save. TEST records only. Build D1.4, 11 Nov 2026.</p></div>
    <div class="util"><span id="user">Not signed in</span><button type="button" id="signOut" hidden>Sign out</button></div>
  </header>
  <div class="bar">
    <label for="pickForm">Form <select id="pickForm" disabled>
      <option value="App-Approval">Approval</option><option value="App-Ranking">Ranking</option>
      <option value="App-Agreement">Agreement</option><option value="App-CVF">Cost verification</option></select></label>
    <label for="pickRec">Record <select id="pickRec" disabled>
      <option>AEP63-26-999</option><option>AEP63-26-998</option><option>AEP63-26-997</option></select></label>
    <button type="button" class="btn" id="reopen" disabled>Reopen (discard changes)</button>
    <span id="sdk" style="color:var(--muted);font-size:13px"></span>
  </div>
  <div id="status" class="notice">Signing in…</div>
  <div id="changedBox" class="ok" hidden></div>
  <div id="own"></div>
  <details class="blk" id="refBox"><summary>Reference: Esri's form on the same record (opens when you expand this)</summary>
    <p id="refChanged" style="color:var(--muted)">Not opened yet.</p><div id="refHost"></div></details>
  <details class="blk"><summary>Diagnostics (for Claude)</summary>
    <p><button type="button" class="btn" id="copyDiag">Copy diagnostics</button> <span id="copied" style="color:var(--muted)"></span></p><pre id="diag"></pre></details>
</div>

<script type="module">
  // ---------------- Settings ----------------
  const CFG = { clientId: "GgRGSkyzcLuMKcSS", portalUrl: "https://clarion.maps.arcgis.com", mapTitle: "WCCD AEP Review (EB)",
                allowed: ["AEP63-26-999", "AEP63-26-998", "AEP63-26-997"], forbidden: "AEP63-25-002" };
  const LEFT = /decision|internal|question|signature/i;      // groups that go in the left column; the rest go right or balance
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mask = (t) => String(t).replace(/(token=)[^&\s]+/gi, "$1•••");
  const normV = (v) => (v === undefined || v === null || v === "") ? null : (v instanceof Date ? v.getTime() : v);
  const same = (a, b) => { a = normV(a); b = normV(b); return a === b || (typeof a === "number" && typeof b === "number" && Math.abs(a - b) < 1e-9); };
  const status = (cls, text) => { $("status").className = cls; $("status").textContent = mask(text); };
  const log = []; const note = (t) => { log.push(mask(t)); };

  let webmap, Graphic, arcade, portalUser = "";
  // Lookup memory: while a record is open, an identical read request to the feature service is answered from memory (reads only; this page never writes).
  const look = { on: false, map: new Map(), hits: 0, misses: 0 };
  const lookKey = (p) => { const q = { ...((p.requestOptions && p.requestOptions.query) || {}) }; delete q.token; return String(p.url).split("?")[0] + "|" + JSON.stringify(Object.keys(q).sort().map((k) => [k, q[k]])); };
  const isRead = (url) => /\/FeatureServer\/\d+\/query$/i.test(String(url).split("?")[0]);
  const copy = (d) => { try { return structuredClone(d); } catch { return d; } };
  try {
    const t0 = Date.now();
    while (!(window.$arcgis && window.$arcgis.import)) { if (Date.now() - t0 > 30000) throw new Error("the ArcGIS SDK did not load"); await new Promise((r) => setTimeout(r, 100)); }
    const [esriConfig, esriId, OAuthInfo, Portal, WebMap, G, A, kernel] = await $arcgis.import([
      "@arcgis/core/config.js", "@arcgis/core/identity/IdentityManager.js", "@arcgis/core/identity/OAuthInfo.js",
      "@arcgis/core/portal/Portal.js", "@arcgis/core/WebMap.js", "@arcgis/core/Graphic.js", "@arcgis/core/arcade.js", "@arcgis/core/kernel.js"]);
    Graphic = G; arcade = A;
    $("sdk").textContent = "SDK " + (kernel && (kernel.fullVersion || kernel.version) || "?");
    esriConfig.portalUrl = CFG.portalUrl;
    esriConfig.request.interceptors.push({
      before(p) { if (!look.on || !isRead(p.url)) return; const k = lookKey(p); if (look.map.has(k)) { look.hits++; return copy(look.map.get(k)); } },
      after(r) { if (!look.on || !isRead(r.url) || r.data == null) return; const k = lookKey({ url: r.url, requestOptions: r.requestOptions }); if (!look.map.has(k)) { look.misses++; look.map.set(k, copy(r.data)); } }
    });
    esriId.registerOAuthInfos([new OAuthInfo({ appId: CFG.clientId, portalUrl: CFG.portalUrl, popup: false })]);
    const sharing = CFG.portalUrl + "/sharing";
    try { await esriId.checkSignInStatus(sharing); } catch { await esriId.getCredential(sharing); }
    const portal = new Portal({ url: CFG.portalUrl, authMode: "immediate" });
    await portal.load();
    portalUser = portal.user.username;
    $("user").textContent = "Signed in as " + portal.user.fullName; $("signOut").hidden = false;
    $("signOut").addEventListener("click", () => { esriId.destroyCredentials(); window.location.href = window.location.pathname; });
    status("notice", "Loading the web map…");
    const res = await portal.queryItems({ query: 'title:"' + CFG.mapTitle + '" AND type:"Web Map"', num: 20 });
    const hits = res.results.filter((i) => i.title === CFG.mapTitle);
    if (hits.length !== 1) throw new Error(hits.length + ' web maps titled "' + CFG.mapTitle + '"');
    webmap = new WebMap({ portalItem: hits[0] });
    await webmap.loadAll();
  } catch (e) { status("error", "Could not start – " + (e.message || e)); throw e; }

  // ---------------- The engine: one open record ----------------
  let S = null;      // { layer, tmpl, fields, feature, original, values, els[], vis{}, req{}, edit{}, calc{}, texts{}, errors{}, dsMode, ms, passes }
  let token = 0;

  function flatten(tmpl) {       // every element with its group, in form order
    const out = [];
    const walk = (els, grp) => { for (const el of els || []) {
      if (el.type === "group") { out.push({ el, grp: null, isGroup: true }); walk(el.elements, el); } else out.push({ el, grp });
    } };
    walk(tmpl.elements, null);
    return out;
  }
  const findInfo = (name) => { const list = S.tmpl.expressionInfos || []; return list.find((x) => x.name === name) || list.find((x) => x.name === "expr/" + name); };
  // A rule is re-run only when a field it mentions has changed. Rules that mention $feature in any other way are re-run every time.
  function depsOf(name) {
    if (S.deps.has(name)) return S.deps.get(name);
    const info = findInfo(name); let d = null;
    if (info) {
      const src = String(info.expression);
      const all = (src.match(/\$feature\b/gi) || []).length;
      const named = [...src.matchAll(/\$feature\s*(?:\.\s*([A-Za-z_][A-Za-z0-9_]*)|\[\s*["']([^"']+)["']\s*\])/gi)].map((m) => (m[1] || m[2]).toLowerCase());
      if (named.length === all) d = [...new Set(named)].map((n) => S.attrKeys[n] || n).sort();
    }
    S.deps.set(name, d);
    return d;
  }
  function exec(name, attrs) {
    const d = depsOf(name);
    const key = name + "|" + (d ? JSON.stringify(d.map((k) => normV(attrs[k]))) : JSON.stringify(attrs));
    if (!S.memo.has(key)) { S.runs++; S.memo.set(key, execNow(name, attrs)); }
    return S.memo.get(key);
  }
  async function execNow(name, attrs) {
    const info = findInfo(name);
    if (!info) throw new Error("expression not found in the form");
    if (!S.exec.has(name)) S.exec.set(name, arcade.createArcadeExecutor(info.expression, arcade.createArcadeProfile("form-calculation")));
    const ex = await S.exec.get(name);
    const g = new Graphic({ attributes: { ...attrs }, geometry: S.feature.geometry, layer: S.layer });
    const gO = new Graphic({ attributes: { ...S.original }, geometry: S.feature.geometry, layer: S.layer });
    const modes = S.dsMode === "layer" ? ["layer", "url"] : ["url", "layer"];
    let last;
    for (const m of modes) {
      try {
        const r = await ex.executeAsync({ "$feature": g, "$originalFeature": gO, "$layer": S.layer, "$datastore": m === "url" ? S.layer.url : S.layer, "$map": webmap, "$editcontext": { editType: "UPDATE" } },
                                         { spatialReference: S.layer.spatialReference });
        if (S.dsMode !== m) { S.dsMode = m; note("$datastore works as: " + m); }
        return r;
      } catch (e) { last = e; }
    }
    throw last;
  }
  const title = (name) => { const i = findInfo(name); return i ? (i.title || name) : name; };
  async function tryExec(name, attrs, fallback, where) {
    try { const r = await exec(name, attrs); delete S.errors[where + " · " + title(name)]; return r; }
    catch (e) { S.errors[where + " · " + title(name)] = mask(e.message || String(e)); return fallback; }
  }
  // Run the form's rules until the values settle.
  async function settle() {
    const t0 = performance.now(); let pass = 0; const runs0 = S.runs;
    const fieldEls = S.els.filter((x) => !x.isGroup && x.el.type === "field").map((x) => x.el);
    for (; pass < 8; pass++) {
      let changed = false;
      const snap = { ...S.values };
      // 1. calculations: run when the field has one and is not editable (rule 1 in eb-form-logic.md). Hidden fields are still calculated (rule 7).
      await Promise.all(fieldEls.filter((el) => el.valueExpression).map(async (el) => {
        const editable = el.editableExpression ? (await tryExec(el.editableExpression, snap, false, el.fieldName + " editable")) === true : false;
        S.edit[el.fieldName] = editable; S.calc[el.fieldName] = !editable;
        if (editable) return;
        const cur = snap[el.fieldName];
        const v = normV(await tryExec(el.valueExpression, snap, cur, el.fieldName + " value"));     // a failing calculation keeps the value (rule 6)
        if (!same(v, cur)) { S.values[el.fieldName] = v; changed = true; }
      }));
      // 2. visibility; a typed field that goes from shown to hidden is emptied, as Esri's form does
      const now = { ...S.values }, groupVis = new Map();
      const visRaw = await Promise.all(S.els.map(({ el }) => el.visibilityExpression
        ? tryExec(el.visibilityExpression, now, true, (el.fieldName || el.label || el.type) + " visible").then((r) => r === true) : true));
      S.els.forEach(({ el, grp, isGroup }, i) => {
        let v = visRaw[i];
        if (isGroup) { groupVis.set(el, v); return; }
        if (grp && groupVis.get(grp) === false) v = false;
        const key = S.key(el), was = S.vis[key];
        S.vis[key] = v;
        if (el.type === "field" && was === true && v === false && !S.calc[el.fieldName] && S.values[el.fieldName] != null) {
          S.values[el.fieldName] = null; S.emptied.add(el.fieldName); changed = true;
        }
      });
      S.groupVis = groupVis;
      if (!changed) break;
    }
    // 3. required, editable (fields without a calculation) and the message lines
    const fin = { ...S.values };
    await Promise.all(S.els.filter((x) => !x.isGroup).map(async ({ el }) => {
      const key = S.key(el);
      if (el.type === "field") {
        const [rq, ed] = await Promise.all([
          el.requiredExpression ? tryExec(el.requiredExpression, fin, false, el.fieldName + " required") : false,
          !el.valueExpression && el.editableExpression ? tryExec(el.editableExpression, fin, true, el.fieldName + " editable") : true]);
        S.req[el.fieldName] = rq === true;
        if (!el.valueExpression) S.edit[el.fieldName] = ed === true;
      } else if (el.type === "text" && S.vis[key] !== false) {
        let txt = String(el.text ?? "");
        const refs = [...txt.matchAll(/\{((?:expr|expression)\/[^}]+)\}/g)];
        const vals = await Promise.all(refs.map((m) => tryExec(m[1], fin, "⚠", "text")));
        refs.forEach((m, i) => { txt = txt.replace(m[0], vals[i] == null ? "" : String(vals[i])); });
        txt = txt.replace(/\{([A-Za-z_][A-Za-z0-9_]*)\}/g, (all, f) => (f in fin ? (fin[f] ?? "") : all));
        S.texts[key] = txt;
      }
    }));
    S.ms = Math.round(performance.now() - t0); S.passes = pass + 1; S.lastRuns = S.runs - runs0;
  }

  // ---------------- Drawing our own inputs ----------------
  const fieldOf = (name) => S.fields[name.toLowerCase()];
  const isNum = (f) => f && /integer|single|double|long/.test(f.type || "");
  function inputHtml(el) {
    const f = fieldOf(el.fieldName), name = el.fieldName, v = S.values[name], locked = S.calc[name] || S.edit[name] === false || (f && f.editable === false);
    const dis = locked ? " disabled" : "", it = (el.input && el.input.type) || "", id = "f_" + name;
    const cvs = (el.domain && el.domain.codedValues) || (f && f.domain && f.domain.codedValues) || null;
    const miss = S.req[name] && v == null ? " missing" : "";
    if (it === "switch") { const on = el.input.onValue, off = el.input.offValue;
      return '<span class="sw"><input type="checkbox" role="switch" id="' + id + '" data-f="' + esc(name) + '" data-kind="switch" data-on="' + esc(on) + '" data-off="' + esc(off) + '"' + (String(v) === String(on) ? " checked" : "") + dis + "> <span>" +
        (String(v) === String(on) ? "On" : "Off") + (v == null ? " (no value stored)" : "") + "</span></span>"; }
    if (cvs && it === "radio-buttons") {
      const opts = cvs.map((c) => '<label><input type="radio" name="' + id + '" data-f="' + esc(name) + '" data-kind="choice" value="' + esc(c.code) + '"' + (String(v) === String(c.code) ? " checked" : "") + dis + "> " + esc(c.name) + "</label>");
      if (el.input.showNoValueOption) opts.unshift('<label><input type="radio" name="' + id + '" data-f="' + esc(name) + '" data-kind="choice" value=""' + (v == null ? " checked" : "") + dis + "> " + esc(el.input.noValueOptionLabel || "No value") + "</label>");
      return '<span class="opts' + miss + '" role="radiogroup" aria-labelledby="l_' + id + '">' + opts.join("") + "</span>"; }
    if (cvs) return '<select id="' + id + '" class="' + miss + '" data-f="' + esc(name) + '" data-kind="choice"' + dis + '><option value="">' + esc((el.input && el.input.noValueOptionLabel) || "No value") + "</option>" +
      cvs.map((c) => '<option value="' + esc(c.code) + '"' + (String(v) === String(c.code) ? " selected" : "") + ">" + esc(c.name) + "</option>").join("") + "</select>";
    if (f && f.type === "date") { const withTime = el.input && el.input.includeTime;
      let val = ""; if (v != null) { const d = new Date(v), p = (n) => String(n).padStart(2, "0"); val = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + (withTime ? "T" + p(d.getHours()) + ":" + p(d.getMinutes()) : ""); }
      return '<input type="' + (withTime ? "datetime-local" : "date") + '" id="' + id + '" class="' + miss + '" data-f="' + esc(name) + '" data-kind="date" value="' + val + '"' + dis + ">"; }
    if (isNum(f)) return '<input type="number" step="any" id="' + id + '" class="' + miss + '" data-f="' + esc(name) + '" data-kind="number" value="' + esc(v ?? "") + '"' + dis + ">";
    if (it === "text-area") return '<textarea id="' + id + '" class="' + miss + '" data-f="' + esc(name) + '" data-kind="text"' + dis + ">" + esc(v ?? "") + "</textarea>";
    return '<input type="text" id="' + id + '" class="' + miss + '" data-f="' + esc(name) + '" data-kind="text" value="' + esc(v ?? "") + '"' + dis + ">";
  }
  const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  function elHtml(el) {
    const key = S.key(el);
    if (S.vis[key] === false) return "";
    if (el.type === "text") return '<div class="info">' + md(S.texts[key] ?? "") + "</div>";
    if (el.type !== "field") return "";
    const f = fieldOf(el.fieldName), id = "f_" + el.fieldName;
    return '<div class="fld' + (S.calc[el.fieldName] ? " calcfld" : "") + '"><label id="l_' + id + '" for="' + id + '">' + esc(el.label || (f && f.alias) || el.fieldName) + (S.req[el.fieldName] ? ' <span class="req">* required</span>' : "") +
      (S.calc[el.fieldName] ? '<span class="calc">calculated</span>' : "") + "</label>" + inputHtml(el) + (el.description ? "<small>" + esc(el.description) + "</small>" : "") + "</div>";
  }
  function render() {
    // sections: runs of loose elements, and groups
    const secs = []; let loose = null;
    for (const x of S.els) {
      if (x.isGroup) { secs.push({ name: x.el.label || "Group", grp: x.el, items: [] }); loose = null; }
      else if (x.grp) secs.find((s) => s.grp === x.grp).items.push(x.el);
      else { if (!loose) { loose = { name: "", items: [] }; secs.push(loose); } loose.items.push(x.el); }
    }
    let html = "", L = [], R = [], hl = 0, hr = 0;
    const flush = () => { if (L.length || R.length) html += '<div class="cols"><div class="col">' + L.join("") + '</div><div class="col">' + R.join("") + "</div></div>"; L = []; R = []; hl = hr = 0; };
    for (const s of secs) {
      if (s.grp && S.groupVis.get(s.grp) === false) continue;
      const body = s.items.map(elHtml).filter(Boolean);
      if (!body.length) continue;
      if (!s.grp) { flush(); html += '<div class="card"><div>' + body.join("") + "</div></div>"; continue; }      // loose elements: full width, in form order
      const left = LEFT.test(s.name) ? true : (L.length && !R.length ? false : hl <= hr);
      const card = '<div class="card' + (left ? "" : " tint") + '"><h2>' + esc(s.name) + "</h2><div>" + body.join("") + "</div></div>";
      if (left) { L.push(card); hl += body.length; } else { R.push(card); hr += body.length; }
    }
    flush();
    const act = document.activeElement, keep = act && $("own").contains(act) ? { id: act.id, name: act.name, val: act.value, type: act.type, a: act.selectionStart, f: act.dataset.f } : null;
    $("own").innerHTML = '<div style="display:flex;flex-direction:column;gap:12px">' + html + "</div>";
    if (keep) {      // keep the cursor, and anything being typed, where it was
      const el = keep.type === "radio" ? [...$("own").querySelectorAll('input[type="radio"]')].find((x) => x.name === keep.name && x.value === keep.val) : (keep.id && document.getElementById(keep.id));
      if (el && !el.disabled) {
        if (/^(text|number|textarea|date|datetime-local)$/.test(keep.type) && !S.calc[keep.f]) el.value = keep.val;
        el.focus({ preventScroll: true });
        if (keep.type === "text" || keep.type === "textarea") { try { el.setSelectionRange(keep.a, keep.a); } catch {} }
      }
    }
    // changed since opening
    const diffs = Object.keys(S.values).filter((k) => !same(S.values[k], S.original[k]));
    const missing = S.els.filter((x) => !x.isGroup && x.el.type === "field" && S.vis[S.key(x.el)] !== false && S.req[x.el.fieldName] && S.values[x.el.fieldName] == null).map((x) => x.el.label || x.el.fieldName);
    const box = $("changedBox"); box.hidden = false;
    box.className = diffs.length ? "warn" : "ok";
    box.textContent = (diffs.length ? "Changed since opening: " + diffs.length + " field(s)\n" + diffs.map((k) => "• " + k + ": " + JSON.stringify(normV(S.original[k])) + " → " + JSON.stringify(normV(S.values[k])) +
        (S.touched.has(k) ? "  (you)" : S.emptied.has(k) ? "  (emptied: hidden)" : "  (calculated)")).join("\n") : "Changed since opening: nothing") +
      (missing.length ? "\nA save would be refused. Required and empty: " + missing.join(", ") : "");
    const errs = Object.entries(S.errors);
    $("diag").textContent = ["Form " + S.layer.title + " · record " + S.id + " · user " + portalUser + " · " + $("sdk").textContent,
      "Settled in " + S.passes + " pass(es), " + S.ms + " ms, " + S.lastRuns + " rule runs this time (" + S.runs + " since opening); rules re-run on every change: " + ([...S.deps].filter(([, d]) => !d).map(([n]) => title(n)).join(", ") || "none") + " · $datastore mode: " + (S.dsMode || "not needed yet"),
      "Lookup memory: " + look.misses + " fetched from ArcGIS Online, " + look.hits + " answered from memory",
      "Expression errors: " + (errs.length ? errs.length : "none"), ...errs.map(([k, v]) => "  ✗ " + k + " → " + v),
      "Changed: " + (diffs.join(", ") || "nothing"), "", "Structure:",
      ...S.els.map((x) => (x.grp ? "    " : "  ") + (x.isGroup ? "GROUP " + JSON.stringify(x.el.label) : x.el.type === "field"
        ? x.el.fieldName + " [" + ((x.el.input && x.el.input.type) || "?") + "]" + (x.el.valueExpression ? " calc=" + title(x.el.valueExpression) : "") + (x.el.editableExpression ? " edit=" + title(x.el.editableExpression) : "") + (x.el.requiredExpression ? " req=" + title(x.el.requiredExpression) : "")
        : x.el.type.toUpperCase() + " " + JSON.stringify(String(x.el.text ?? "").slice(0, 90))) + (x.el.visibilityExpression ? " vis=" + title(x.el.visibilityExpression) : "") + (x.isGroup ? "" : " → " + (S.vis[S.key(x.el)] === false ? "hidden" : "shown"))),
      "", "Log:", ...log].join("\n");
    if (errs.length) status("error", errs.length + " rule(s) could not be run by this page. See Diagnostics. The values they control are not reliable here.");
  }

  async function openRecord() {
    const my = ++token;
    look.on = false; look.map.clear(); look.hits = 0; look.misses = 0;
    $("own").innerHTML = ""; $("changedBox").hidden = true; $("refHost").innerHTML = ""; $("refChanged").textContent = "Not opened yet."; $("refBox").open = false;
    const lt = $("pickForm").value, id = $("pickRec").value;
    try {
      if (!CFG.allowed.includes(id) || id.includes(CFG.forbidden)) throw new Error("refused: not a TEST record");
      status("notice", "Opening " + id + "…");
      const layer = webmap.allLayers.find((l) => l.title === lt);
      if (!layer) throw new Error('no layer titled "' + lt + '"');
      await layer.load();
      if (!layer.formTemplate) throw new Error(lt + " has no Map Viewer form");
      const q = await layer.queryFeatures({ where: "AEPID = '" + id + "'", outFields: ["*"], returnGeometry: true });
      if (q.features.length !== 1) throw new Error(q.features.length + " records matched " + id);
      if (my !== token) return;
      const feature = q.features[0], tmpl = layer.formTemplate.clone();
      const keys = new Map(); let n = 0;
      S = { id, layer, tmpl, feature, original: { ...feature.attributes }, values: { ...feature.attributes }, fields: Object.fromEntries(layer.fields.map((f) => [f.name.toLowerCase(), f])),
            els: flatten(tmpl), vis: {}, req: {}, edit: {}, calc: {}, texts: {}, errors: {}, exec: new Map(), memo: new Map(), deps: new Map(), attrKeys: Object.fromEntries(Object.keys(feature.attributes).map((k) => [k.toLowerCase(), k])), runs: 0, dsMode: null, touched: new Set(), emptied: new Set(), groupVis: new Map(),
            key: (el) => { if (!keys.has(el)) keys.set(el, "e" + (n++)); return keys.get(el); } };
      look.on = true;                      // from here on, repeated reads for this record come from memory
      status("notice", "Running the form's rules…");
      await settle();
      if (my !== token) return;
      const diffs = Object.keys(S.values).filter((k) => !same(S.values[k], S.original[k]));
      status(diffs.length ? "error" : "notice", diffs.length ? "The page's own rule run changed " + diffs.length + " value(s) on opening. See the list below." : "Opened with nothing changed (rules run in " + (S.ms / 1000).toFixed(1) + " s). This page cannot save.");
      render();
    } catch (e) { status("error", "Could not open – " + (e.message || e)); console.error(e); }
  }

  // one handler for every input we drew
  let running = false, pending = false;
  $("own").addEventListener("change", async (evt) => {
    const t = evt.target, name = t.dataset && t.dataset.f; if (!name || !S) return;
    const f = fieldOf(name), kind = t.dataset.kind; let v;
    if (kind === "switch") v = t.checked ? t.dataset.on : t.dataset.off;
    else if (kind === "date") { v = t.value ? new Date(t.value.length > 10 ? t.value : t.value + "T00:00").getTime() : null; }
    else if (kind === "number") v = t.value === "" ? null : Number(t.value);
    else v = t.value === "" ? null : t.value;
    if ((kind === "choice" || kind === "switch") && v != null && isNum(f)) v = Number(v);
    S.values[name] = v; S.touched.add(name);
    pending = true;
    if (running) return;                 // the run in progress is followed by another one
    running = true; const my = token, t0 = performance.now();
    $("own").classList.add("running"); status("notice", "Running the form's rules… you can keep working.");
    try {
      while (pending && my === token) { pending = false; await settle(); }
      if (my === token) { status("notice", "Rules run in " + ((performance.now() - t0) / 1000).toFixed(1) + " s (" + S.lastRuns + " rule runs). This page cannot save."); render(); }
    } catch (e) { status("error", "The rules could not be run – " + (e.message || e)); }
    running = false; $("own").classList.remove("running");
  });

  // ---------------- Reference: Esri's own form on the same record (read-only use; this page has no save) ----------------
  let refTimer = null;
  $("refBox").addEventListener("toggle", async () => {
    if (!$("refBox").open || !S || $("refHost").firstChild) return;
    const my = token, s = S;
    try {
      const form = document.createElement("arcgis-feature-form");
      $("refHost").appendChild(form);
      await form.componentOnReady();
      form.map = webmap; form.layer = s.layer; form.formTemplate = s.layer.formTemplate.clone();
      form.feature = new Graphic({ attributes: { ...s.original }, geometry: s.feature.geometry, layer: s.layer });
      clearInterval(refTimer);
      refTimer = setInterval(async () => {
        if (my !== token) { clearInterval(refTimer); return; }
        try { const vals = await form.getValues();
          const d = Object.keys(vals).filter((k) => k in s.original && !same(vals[k], s.original[k]));
          $("refChanged").textContent = "Esri's form, changed since opening: " + (d.length ? d.map((k) => k + ": " + JSON.stringify(normV(s.original[k])) + " → " + JSON.stringify(normV(vals[k]))).join(" · ") : "nothing");
        } catch { /* still loading */ }
      }, 1000);
    } catch (e) { $("refChanged").textContent = mask("Esri's form could not be opened – " + (e.message || e)); }
  });

  $("copyDiag").addEventListener("click", async () => { try { await navigator.clipboard.writeText($("diag").textContent); $("copied").textContent = "Copied."; } catch { $("copied").textContent = "Select the text and copy it by hand."; } });
  for (const id of ["pickForm", "pickRec"]) { $(id).disabled = false; $(id).addEventListener("change", openRecord); }
  $("reopen").disabled = false; $("reopen").addEventListener("click", openRecord);
  await openRecord();
</script>
</body>
</html>

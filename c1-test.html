<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WCCD AEP – C1 form test</title>

  <!-- ArcGIS Maps SDK for JavaScript, PINNED to 5.1 (core + map components + Calcite) -->
  <script>
    // Run 15: the SDK version is chosen with the buttons on the page (remembered in this browser only).
    // Default and pinned version is 5.1; 5.2 is for this read-only test.
    (function () {
      var v = "5.1";
      try { var c = localStorage.getItem("wccdSdk"); if (c === "5.2" || c === "5.1") v = c; } catch (e) {}
      window.WCCD_SDK = v;
      var sc = document.createElement("script");
      sc.type = "module"; sc.src = "https://js.arcgis.com/" + v + "/";
      document.head.appendChild(sc);
    })();
  </script>

  <style>
    html, body { margin: 0; height: 100%; font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; }
    calcite-shell { height: 100%; }
    #main { padding: 16px; overflow: auto; height: 100%; box-sizing: border-box; }
    #controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
    #controls calcite-label { margin: 0; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #eef3f8; }
    .diff { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
    #status { font-size: 13px; margin: 8px 0; }
    .ok { color: #2e7d32; } .bad { color: #c62828; } .wait { color: #777; }
    #formHost arcgis-feature-form { display: block; max-width: 100%; overflow-x: hidden; overflow-wrap: anywhere; }
    .hdr-user { font-size: 13px; margin-right: 8px; }
  </style>
</head>
<body>
<calcite-shell>
  <calcite-navigation slot="header">
    <calcite-navigation-logo slot="logo" heading="WCCD AEP – C1 form test"
      description="Run 15 – every form × every TEST record, on SDK 5.1 or 5.2 · field comparison · read-only, this page cannot save"></calcite-navigation-logo>
    <div slot="content-end" style="display:flex;align-items:center;padding-right:12px;">
      <span id="user" class="hdr-user">Not signed in</span>
      <calcite-button id="signOut" appearance="outline" scale="s" disabled>Sign out</calcite-button>
    </div>
  </calcite-navigation>

  <div id="main">
    <div style="font-size:14px;margin-bottom:6px;"><b>SDK in use: <span id="sdkVer">…</span></b>
      &nbsp; <calcite-button id="use51" scale="s" appearance="outline">Reload with SDK 5.1</calcite-button>
      <calcite-button id="use52" scale="s" appearance="outline">Reload with SDK 5.2</calcite-button></div>
    <div id="status" class="wait">○ Loading…</div>
    <details style="margin:8px 0;"><summary style="cursor:pointer;font-size:13px;">CVF field comparison (working field vs. empty ones)</summary>
      <calcite-button id="copyCmp" scale="s" appearance="outline" style="margin:6px 0;">Copy comparison text</calcite-button>
      <div id="cmp" class="diff"></div></details>
    <div id="controls">
      <calcite-button id="runAll" disabled>Run all combinations</calcite-button>
      <calcite-label>Form
        <calcite-select id="pickForm" disabled></calcite-select>
      </calcite-label>
      <calcite-label>Record
        <calcite-select id="pickRec" disabled></calcite-select>
      </calcite-label>
      <calcite-button id="openOne" appearance="outline" disabled>Open this one</calcite-button>
    </div>
    <table>
      <thead><tr><th>Form</th><th>Record</th><th>Opens unchanged?</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </div>

  <calcite-shell-panel slot="panel-end" width="l" resizable>
    <calcite-panel id="formPanel" heading="Form">
      <div id="formHost"></div>
      <div slot="footer" style="width:100%;padding:8px 12px;font-size:13px;" id="formStatus" class="wait"></div>
    </calcite-panel>
  </calcite-shell-panel>
</calcite-shell>

<script type="module">
  // ---------- Settings ----------
  const CLIENT_ID  = "GgRGSkyzcLuMKcSS";
  const PORTAL_URL = "https://clarion.maps.arcgis.com";
  const MAP_TITLE  = "WCCD AEP Review (EB)";
  const PARENT_FORMS = ["App-Ranking", "App-Approval", "App-Agreement", "App-CVF"];
  const ROWS_TABLE   = "Field Rows";
  const TEST_IDS   = ["AEP63-26-999", "AEP63-26-998", "AEP63-26-997"];   // the ONLY records this page opens
  const FORBIDDEN  = "AEP63-25-002";                                      // Campbell – never open

  const $ = (id) => document.getElementById(id);
  const mask = (t) => String(t).replace(/(token=)[^&\s]+/gi, "$1•••");
  function setStatus(el, state, text) { el.className = state; el.textContent = mask(text); }
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  // SDK switch buttons (work even if the SDK fails to load)
  const setSdk = (v) => { try { localStorage.setItem("wccdSdk", v); } catch (e) {} window.location.href = window.location.pathname; };
  $("use51").addEventListener("click", () => setSdk("5.1"));
  $("use52").addEventListener("click", () => setSdk("5.2"));
  $("sdkVer").textContent = window.WCCD_SDK + " (loading…)";
  {
    const t0 = Date.now();
    while (!(window.$arcgis && window.$arcgis.import)) {
      if (Date.now() - t0 > 30000) { setStatus($("status"), "bad", "SDK " + window.WCCD_SDK + " did not load from js.arcgis.com"); throw new Error("SDK load timeout"); }
      await sleep(100);
    }
  }
  const kernel = await $arcgis.import("@arcgis/core/kernel.js");
  $("sdkVer").textContent = (kernel.fullVersion || kernel.version || "?") + " (asked for " + window.WCCD_SDK + ")";

  const [esriConfig, esriId, OAuthInfo, Portal, WebMap] = await $arcgis.import([
    "@arcgis/core/config.js",
    "@arcgis/core/identity/IdentityManager.js",
    "@arcgis/core/identity/OAuthInfo.js",
    "@arcgis/core/portal/Portal.js",
    "@arcgis/core/WebMap.js"
  ]);
  esriConfig.portalUrl = PORTAL_URL;

  // ---------- Sign in ----------
  const info = new OAuthInfo({ appId: CLIENT_ID, portalUrl: PORTAL_URL, popup: false });
  esriId.registerOAuthInfos([info]);
  const sharingUrl = PORTAL_URL + "/sharing";
  try { await esriId.checkSignInStatus(sharingUrl); } catch { await esriId.getCredential(sharingUrl); }
  const portal = new Portal({ url: PORTAL_URL, authMode: "immediate" });
  await portal.load();
  $("user").textContent = portal.user.fullName + " (" + portal.user.username + ")";
  $("signOut").disabled = false;
  $("signOut").addEventListener("click", () => { esriId.destroyCredentials(); window.location.href = window.location.pathname; });

  // ---------- Load the web map, the four layer copies, the Field Rows table, and the TEST records ----------
  const combos = [];   // { formTitle, layer, feature, label }
  let webmap;
  try {
    const res = await portal.queryItems({ query: 'title:"' + MAP_TITLE + '" AND type:"Web Map"', num: 20 });
    const hits = res.results.filter(i => i.title === MAP_TITLE);
    if (hits.length !== 1) throw new Error(hits.length + " web maps with that exact title");
    webmap = new WebMap({ portalItem: hits[0] });
    await webmap.loadAll();

    const where = TEST_IDS.map(id => "AEPID LIKE '%" + id + "'").join(" OR ");
    const parentGids = {};   // AEPID -> GlobalID
    const missing = [];

    for (const title of PARENT_FORMS) {
      const lyr = webmap.allLayers.find(l => l.title === title);
      if (!lyr) { missing.push(title); continue; }
      await lyr.load();
      if (!lyr.formTemplate) { missing.push(title + " (no form)"); continue; }
      const q = await lyr.queryFeatures({ where, outFields: ["*"], returnGeometry: false });
      const feats = q.features
        .filter(f => !String(f.attributes.AEPID || "").includes(FORBIDDEN))
        .sort((a, b) => String(b.attributes.AEPID).localeCompare(String(a.attributes.AEPID)));
      for (const f of feats) {
        const id = String(f.attributes.AEPID);
        parentGids[id] = f.attributes[lyr.globalIdField || "GlobalID"];
        combos.push({ formTitle: title, layer: lyr, feature: f, label: id });
      }
    }

    const tbl = webmap.allTables.find(t => t.title === ROWS_TABLE);
    if (!tbl) missing.push(ROWS_TABLE);
    else {
      await tbl.load();
      if (!tbl.formTemplate) missing.push(ROWS_TABLE + " (no form)");
      else {
        for (const [id, gid] of Object.entries(parentGids)) {
          if (!gid) continue;
          const q = await tbl.queryFeatures({ where: "parentglobalid = '" + gid + "'", outFields: ["*"] });
          for (const f of q.features) {
            const a = f.attributes;
            const rowName = a.FieldLabelResolved || a.FieldName || a.FieldID || ("row " + a[tbl.objectIdField]);
            combos.push({ formTitle: ROWS_TABLE, layer: tbl, feature: f, label: id + " · " + rowName });
          }
        }
      }
    }

    // fill the pickers and the table
    const forms = [...new Set(combos.map(c => c.formTitle))];
    $("pickForm").innerHTML = forms.map(f => `<calcite-option value="${f}">${f}</calcite-option>`).join("");
    const fillRecs = () => {
      const f = $("pickForm").value || forms[0];
      $("pickRec").innerHTML = combos.map((c, i) => c.formTitle === f ? `<calcite-option value="${i}">${c.label}</calcite-option>` : "").join("");
    };
    $("pickForm").addEventListener("calciteSelectChange", fillRecs);
    fillRecs();
    $("results").innerHTML = combos.map((c, i) =>
      `<tr><td>${c.formTitle}</td><td>${c.label}</td><td id="r${i}" class="wait">not run</td></tr>`).join("");
    // ---------- CVF field comparison ----------
    try {
      const cvf = webmap.allLayers.find(l => l.title === "App-CVF");
      const rec = combos.find(c => c.formTitle === "App-CVF" && c.label.endsWith("999"));
      const names = ["TonsPurchased", "ActualCostPerTon", "TotalReimbursementPaid", "CheckedBy", "CheckNumber", "SpotCheckDone", "CVFReceivedDate", "VendorName"];
      const j = cvf.formTemplate.toJSON();
      const els = {};
      (function walk(a, grp) { for (const el of a || []) {
        if (el.fieldName) els[el.fieldName] = { group: grp || "(top level)", el };
        walk(el.formElements || el.elements, el.label || grp);
      } })(j.formElements || j.elements, "");
      const exprs = {};
      for (const e of j.expressionInfos || []) exprs[e.name] = e;
      const out = ["SDK " + (kernel.fullVersion || kernel.version), "typeIdField: " + cvf.typeIdField + " · types: " + (cvf.types || []).length + " · subtypeField: " + cvf.subtypeField, ""];
      for (const n of names) {
        const f = cvf.fields.find(x => x.name === n);
        const fj = f ? f.toJSON() : null;
        const v = rec ? rec.feature.attributes[n] : undefined;
        out.push("== " + n + (n === "TonsPurchased" ? "   (LOADS)" : "   (empty in the form)"));
        out.push("stored value: " + JSON.stringify(v) + " (" + typeof v + ")");
        out.push("field: " + JSON.stringify(fj));
        out.push("in group: " + (els[n] ? els[n].group : "NOT IN FORM"));
        out.push("element: " + JSON.stringify(els[n] ? els[n].el : null));
        for (const key of ["visibilityExpression", "editableExpression", "requiredExpression", "valueExpression"]) {
          const en = els[n] && els[n].el[key];
          if (en) out.push("  " + key + " " + en + " = " + JSON.stringify(exprs[en] ? { title: exprs[en].title, returnType: exprs[en].returnType, expression: exprs[en].expression } : "MISSING"));
        }
        out.push("");
      }
      $("cmp").textContent = out.join("\n");
    } catch (e) { $("cmp").textContent = "comparison failed: " + (e.message || e); }
    $("copyCmp").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText($("cmp").textContent); $("copyCmp").textContent = "Copied"; } catch (e) { $("copyCmp").textContent = "Copy failed – select the text by hand"; }
    });

    ["runAll", "pickForm", "pickRec", "openOne"].forEach(id => $(id).disabled = false);
    setStatus($("status"), missing.length ? "bad" : "ok",
      "Signed in as " + portal.user.username + " · " + combos.length + " form/record combinations found" +
      (missing.length ? " · missing: " + missing.join(", ") : ""));
  } catch (e) { setStatus($("status"), "bad", "Load failed – " + (e.message || e)); console.error(e); throw e; }

  // ---------- Open one combination in a brand-new form, wait for it to settle, compare with the stored values ----------
  function norm(v) {
    if (v === undefined || v === null || v === "") return null;
    if (v instanceof Date) return v.getTime();
    return v;
  }
  async function openAndCheck(i) {
    const c = combos[i];
    const cell = $("r" + i);
    setStatus(cell, "wait", "opening…");
    $("formPanel").heading = c.formTitle + " – " + c.label;
    // a fresh component for every combination, like opening the record anew
    $("formHost").innerHTML = "";
    const form = document.createElement("arcgis-feature-form");
    $("formHost").appendChild(form);
    await form.componentOnReady();
    const original = { ...c.feature.attributes };
    form.map = webmap;
    form.layer = c.layer;
    form.formTemplate = c.layer.formTemplate.clone();    // the Run 6 fix: always a copy
    form.feature = c.feature.clone();

    // settle: same result 4 checks in a row (about 3 s), at most 20 s
    let last = null, same = 0, diffs = [];
    const t0 = Date.now();
    await sleep(1500);
    while (Date.now() - t0 < 20000) {
      try {
        const vals = await form.getValues();
        diffs = [];
        for (const k of Object.keys(vals)) {
          if (!(k in original)) continue;
          const a = norm(original[k]), b = norm(vals[k]);
          if (a !== b) {
            const r = form.feature && form.feature.attributes ? norm(form.feature.attributes[k]) : "n/a";
            diffs.push(k + ": stored " + JSON.stringify(a) + " · form reports " + JSON.stringify(b) + " · form's record " + JSON.stringify(r));
          }
        }
        const sig = diffs.join("|");
        same = (sig === last) ? same + 1 : 0;
        last = sig;
        if (same >= 4) break;
      } catch (e) { /* still calculating */ }
      await sleep(700);
    }
    if (!diffs.length) { setStatus(cell, "ok", "✔ nothing changed"); }
    else {
      cell.className = "bad";
      cell.innerHTML = "✖ " + diffs.length + " field(s)<div class='diff'></div>";
      cell.querySelector(".diff").textContent = diffs.join("\n");
    }
    setStatus($("formStatus"), diffs.length ? "bad" : "ok",
      c.formTitle + " · " + c.label + " · changed since opening: " + (diffs.length ? diffs.length + " field(s)" : "nothing"));
    return diffs.length;
  }

  $("openOne").addEventListener("click", () => openAndCheck(Number($("pickRec").value)));
  $("runAll").addEventListener("click", async () => {
    ["runAll", "openOne"].forEach(id => $(id).disabled = true);
    let bad = 0;
    for (let i = 0; i < combos.length; i++) { bad += (await openAndCheck(i)) ? 1 : 0; }
    setStatus($("status"), bad ? "bad" : "ok",
      "SDK " + (kernel.fullVersion || kernel.version) + " · Run all finished: " + (combos.length - bad) + " of " + combos.length + " combinations open unchanged" +
      (bad ? " · " + bad + " changed (see table)" : ""));
    ["runAll", "openOne"].forEach(id => $(id).disabled = false);
  });
</script>
</body>
</html>

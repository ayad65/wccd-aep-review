:root{--bg:#0B0F12;--panel:#131A20;--panel2:#1B242C;--line:#26303A;--line2:#4A5866;--ink:#F2EFE9;--dim:#9AA7B3;--acc:#FFB45A;--acc2:#F08C00;--warn:#FF9C8A;--warnbg:#2A1A18;--red:#FF5A3C;
  --s1:#E4572E;--s2:#F0A202;--s3:#9BC53D;--s4:#1B8A5A;--s5:#0B7C8A;--s6:#2A4FA8}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans","Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:78px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;align-items:center;border-right:1px solid var(--line);padding:12px 0}
.rail img{width:44px;margin-bottom:10px}.rail a{width:62px;padding:7px 0;border-radius:9px;text-align:center;font-size:11px;color:var(--dim);font-weight:600}
.rail a svg{display:block;margin:0 auto 2px;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail a.on{background:rgba(255,180,90,.16);color:var(--acc)}.rail a:hover{color:var(--ink)}.rail a.soon{opacity:.45}.rail .sp{flex:1}.rail a.cl{border:1px dashed var(--line2)}
main{padding:14px 18px 40px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font:700 22px "Barlow Semi Condensed",sans-serif;margin:0}.top .sub{color:var(--dim);font-size:12.5px}
.top select{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font:inherit}
.figs{margin-left:auto;display:flex;gap:24px}.figs span{font-size:11.5px;color:var(--dim);text-align:right}.figs b{display:block;font:700 22px "Barlow Semi Condensed",sans-serif;color:var(--acc)}
.util{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--dim);margin-bottom:6px}.util button{background:none;border:1px solid var(--line2);border-radius:12px;padding:2px 10px;font-size:12px}
#status{padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}#status.error{border-color:var(--red);color:var(--warn)}
.n{font-style:normal;display:inline-flex;border-radius:50%;background:var(--c);color:#fff;font-weight:700;align-items:center;justify-content:center;flex:none;width:24px;height:24px;font-size:13px}

.homeg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}.mapc{position:relative;background:#06090C;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(62vh,640px);min-height:380px}

.hside{display:flex;flex-direction:column;gap:12px;min-height:0}.needc{overflow:auto;max-height:min(46vh,480px)}

.mk u{display:block;width:1px;height:var(--h);background:rgba(255,255,255,.4)}
.mk:hover{z-index:9}.mk:hover b,.mk:focus-visible b{transform:scale(1.28);box-shadow:0 0 18px 3px var(--acc)}.mk:hover em{color:#fff}
.tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--acc);border-radius:9px;padding:8px 10px;z-index:8;min-width:170px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.6);text-align:left}

.mk:hover .tip,.mk:focus-visible .tip{display:block}
.board{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:8px;overflow-x:auto}.bcol{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:8px;min-height:300px}
.bh{display:flex;align-items:center;gap:6px;margin-bottom:8px}.bh .n{width:28px;height:28px;font-size:15px}.bh span{color:var(--dim);font-size:12px}
.bc{display:block;background:var(--panel2);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;border-left:4px solid transparent}.bc b{display:block;font-size:11px;color:var(--dim)}.bc:hover{outline:1px solid var(--acc)}
.bc.need2{border-left-color:var(--red);background:var(--warnbg)}.bc ul{margin:4px 0 0;padding-left:15px;color:var(--warn);font-size:11.5px}.bc .tag{display:inline-block;font-size:10.5px;color:var(--dim);border:1px solid var(--line2);border-radius:8px;padding:0 6px;margin-top:3px}
.bcnone{border:1px dashed var(--line2);color:var(--dim);text-align:center;border-radius:8px;padding:7px;font-size:12px}
.wnote{font-size:12px;color:var(--dim);margin:10px 2px 0}.foot{margin-top:18px;font-size:11.5px;color:var(--dim)}
.soonp{max-width:560px}.soonp p{color:var(--dim)}
@media (max-width:900px){.homeg{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:6px}.rail img{margin:0 6px 0 0;width:34px}.rail .sp{display:none}.figs{margin-left:0}}

.mcard strong{display:block;font-size:14px;color:#fff}.mcard small{display:block;color:var(--dim);margin-bottom:5px}.mcard span{display:flex;gap:6px;align-items:center;color:#DDE3E8;padding:1px 0}.mcard .n{width:17px;height:17px;font-size:10px}.mcard em{display:block;font-style:normal;color:var(--warn);margin-top:4px}.mcard u{display:block;text-decoration:none;color:var(--acc);font-size:11px;margin-top:4px}

/* application sheet */
.top .bk{color:var(--acc);font-weight:600}.cbtn{border:1px solid var(--line2);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--ink)}.cbtn:hover{border-color:var(--acc)}

/* ---- the classic app's own stylesheet, scoped to the editor inside the application page (generated by scope_css.py) ---- */
.edzone.ed{--ink:#1A1D21; --muted:#4A525B; --line:#C9CED4; --soft:#E3E6EA; --bg:#F4F5F6; --blue:#17457A; --blue-bg:#E6EEF7;
            --red:#8A1515; --red-bg:#FBE4E4; --amber:#E08A1E;
            --teal:#1F5A52; --teal-bg:#D5E8E4; --closed-bg:#EDF5F3; --closed-line:#9DBDB6; --ink:#10242A; --muted:#47606A; --line:#C6D3D0; --soft:#DCE5E3; --bg:#F3F6F5; --blue:#14323A; --blue-bg:#E4EEEC; --amber:#F0A202;
            --s1:#E4572E; --s2:#F0A202; --s3:#9BC53D; --s4:#1B8A5A; --s5:#0B7C8A; --s6:#2A4FA8; --rail:#14323A; --teal:#1B8A5A; --teal-bg:#E3F1EA; --closed-bg:#E7ECF8; --closed-line:#9FB1DE; color:var(--ink);font-size:15px;line-height:1.45}
.edzone.ed *{box-sizing: border-box;}
.edzone.ed a{color: var(--blue);}
.edzone.ed a:hover{color: #0E2C50;}
.edzone.ed .wrap{max-width: 1392px; margin: 0 auto; padding: 0 24px;}
.edzone.ed .vh{position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;}
.edzone.ed h1,.edzone.ed h2{font-family: "Space Grotesk", Inter, sans-serif; margin: 0;}
.edzone.ed .util{display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding-top: 8px;}
.edzone.ed .util button{border: 0; background: none; color: var(--blue); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; min-height: 32px;}
.edzone.ed .bar{display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 6px 0 14px;}
.edzone.ed .brand small{display: block; font-size: 12px; font-weight: 600; color: var(--muted);}
.edzone.ed .brand span{font-family: "Space Grotesk", Inter, sans-serif; font-size: 26px; font-weight: 700;}
.edzone.ed .right{display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px;}
.edzone.ed nav.menu{display: flex; gap: 20px;}
.edzone.ed nav.menu a{color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 0; border-bottom: 3px solid transparent;}
.edzone.ed nav.menu a[aria-current="page"]{font-weight: 700; border-bottom-color: var(--blue);}
.edzone.ed input[type="search"],.edzone.ed select{height: 44px; padding: 0 12px; border: 1px solid #6B747E; border-radius: 4px; font: inherit; font-size: 14px; background: #fff; color: var(--ink);}
.edzone.ed #q{width: 240px; max-width: 100%;}
.edzone.ed main{padding: 24px 0 48px; display: flex; flex-direction: column; gap: 20px; min-width: 0;}
.edzone.ed main > section,.edzone.ed main > section > div,.edzone.ed .box{min-width: 0; max-width: 100%;}
.edzone.ed .start{display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;}
.edzone.ed .start h1{font-size: 22px;}

/* ---- the Dashboard look on the classic editor: colours, type, buttons and boxes only. The editor's code and layout are unchanged. ---- */
.edzone.ed.ed{--ink:#1E1712;--muted:#6B5D52;--line:#D9CEC2;--soft:#EAE2D8;--bg:#F7F3EE;--blue:#2A1A10;--blue-bg:#FFF4E3;--teal-bg:#FFF4E3;--red:#C2410C;--red-bg:#FFF1EC;--s5:#E8742E;
  color:var(--ink);font:14px/1.45 "Public Sans","Segoe UI",system-ui,sans-serif;margin-top:8px}
.edzone.ed.ed .pane{padding:0;background:none;border:0;box-shadow:none}
.edzone.ed.ed h2{font:700 19px "Barlow Semi Condensed",sans-serif;margin:6px 0 8px;color:var(--ink)}
.edzone.ed.ed h3{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 8px}
.edzone.ed.ed .notice{background:#FFF4D6;border:0;border-left:4px solid #F0A202;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#4A3A12;margin:6px 0}
.edzone.ed.ed .error{background:#FFE4DC;border:0;border-left:4px solid #C2410C;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#7A1F0C;white-space:pre-wrap}
.edzone.ed.ed .okmsg{background:#E3F1EA;border:0;border-left:4px solid #1B8A5A;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#14532D}
/* side tabs */
.edzone.ed.ed .stabs{margin-top:8px}
.edzone.ed.ed .sttab{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-right:0;border-left:4px solid transparent;border-radius:10px 0 0 10px;background:var(--soft);color:var(--muted);font:600 13px "Public Sans",sans-serif}
.edzone.ed.ed .sttab:hover{background:#F1EAE1;color:var(--ink)}
.edzone.ed.ed .sttab[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700;border-left-color:#E8742E;border-right:1px solid #fff}
.edzone.ed.ed .sttab:focus-visible{outline:3px solid #E8742E;outline-offset:-3px}
.edzone.ed.ed .stmark{background:#C2410C;color:#fff}
.edzone.ed.ed .stbody{background:#fff;border:1px solid var(--line);border-radius:0 12px 12px 0;padding:12px 14px}
.edzone.ed.ed .ecard{background:none;border:0;box-shadow:none;padding:0;margin:0 0 6px}

.edzone.ed.ed .fld small,.edzone.ed.ed .small{font-size:11.5px;color:var(--muted)}
.edzone.ed.ed input[type=text],.edzone.ed.ed input[type=number],.edzone.ed.ed input[type=date],.edzone.ed.ed input[type=datetime-local],.edzone.ed.ed input:not([type]),.edzone.ed.ed select,.edzone.ed.ed textarea{
  min-height:36px;height:auto;border:1.5px solid #C9BFB5;border-radius:7px;padding:6px 9px;font:600 14px "Public Sans",sans-serif;background:#fff;color:var(--ink);box-shadow:none}
.edzone.ed.ed input:focus,.edzone.ed.ed select:focus,.edzone.ed.ed textarea:focus{outline:none;border-color:#E8742E;box-shadow:0 0 0 3px rgba(232,116,46,.25)}
.edzone.ed.ed input:disabled,.edzone.ed.ed select:disabled,.edzone.ed.ed textarea:disabled{background:#F1EAE1;color:var(--muted);border-style:dashed}
.edzone.ed.ed .missing,.edzone.ed.ed input.missing,.edzone.ed.ed select.missing,.edzone.ed.ed textarea.missing{border-color:#C2410C;background:#FFF1EC}
.edzone.ed.ed .req{color:#C2410C}
.edzone.ed.ed .cval{font-weight:700;color:var(--muted)}
/* Yes / No and other choices as joined buttons */
.edzone.ed.ed .opts{display:inline-flex;flex-wrap:wrap;gap:0;border:1.5px solid #B9ADA2;border-radius:8px;overflow:hidden;background:#fff;padding:0}
.edzone.ed.ed .opts label{display:flex;align-items:center;margin:0;padding:6px 14px;font-weight:700;font-size:13px;color:#8A7D72;border-left:1px solid #E0D5CA;cursor:pointer;position:relative}
.edzone.ed.ed .opts label:first-child{border-left:0}
.edzone.ed.ed .opts label input{position:absolute;opacity:0;width:1px;height:1px}
.edzone.ed.ed .opts label:has(input:checked){background:#E8742E;color:#fff}
.edzone.ed.ed .opts label:has(input:focus-visible){outline:3px solid #2A1A10;outline-offset:-3px}
.edzone.ed.ed .opts label:has(input:disabled){cursor:not-allowed;opacity:.6}
.edzone.ed.ed .opts label.clr{font-weight:600;color:#B4500F;background:#FFF9EF}
.edzone.ed.ed .opts.missing{border-color:#C2410C;box-shadow:0 0 0 3px rgba(194,65,12,.2);background:#fff}
.edzone.ed.ed .sw input{accent-color:#E8742E;width:18px;height:18px}

.edzone.ed.ed .edBtns{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:#2A1A10;color:#FFC48A;border:0;font-size:12.5px}
.edzone.ed.ed .edBtns>span{flex:1;color:#FFC48A}
.edzone.ed.ed .btn{height:36px;min-height:0;padding:0 16px;border-radius:18px;border:1.5px solid #FFC48A;background:none;color:#FFE9CF;font:700 13px "Public Sans",sans-serif;cursor:pointer}
.edzone.ed.ed .btn.go{border:0;background:linear-gradient(180deg,#FFB45A,#F08C00);color:#1E1005}
.edzone.ed.ed .btn:disabled{opacity:.45;cursor:not-allowed}
.edzone.ed.ed .btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* review panel */
.edzone.ed.ed .review{background:#fff;border:2px solid #2A1A10;border-radius:12px;padding:12px 14px;margin-top:10px}
.edzone.ed.ed .review h3{font:700 17px "Barlow Semi Condensed",sans-serif;color:var(--ink);margin:0 0 8px}
.edzone.ed.ed .review>div>b{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.edzone.ed.ed .review ul{margin:3px 0 0;padding-left:18px}.edzone.ed.ed .review li{padding:2px 0;font-weight:600}
.edzone.ed.ed details.diag{margin-top:10px;font-size:11.5px;color:var(--muted)}.edzone.ed.ed details.diag pre{font-size:11px;white-space:pre-wrap}
.edzone.ed.ed a{color:#B4500F}

/* fixes after the first live look (18 Nov): choices always side by side; a long changes line wraps instead of pushing the buttons out */
.edzone.ed.ed .opts,.edzone.ed.ed .opts.inline{flex-direction:row;align-items:stretch;width:auto;max-width:100%}
.edzone.ed.ed .opts label{width:auto;min-height:0;white-space:nowrap}
.edzone.ed.ed .edBtns{flex-wrap:wrap}.edzone.ed.ed .edBtns>span{flex:1 1 320px;min-width:0}
/* panels for adding and deleting (same code as the classic view) */
.edzone.ed.ed .tool{background:#fff;border:2px solid #2A1A10;border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink)}
.edzone.ed.ed .tool.del{background:#FFF1EC;border-color:#C2410C}
.edzone.ed.ed .tool h3{font:700 17px "Barlow Semi Condensed",sans-serif;color:var(--ink);margin:0 0 6px}
.edzone.ed.ed .tool .frow{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.edzone.ed.ed .tool .frow label{display:block;font-weight:600;font-size:13px;margin-bottom:3px}
.edzone.ed.ed .tool .btn{border-color:#2A1A10;color:#2A1A10;margin-right:8px}.edzone.ed.ed .tool .btn.go{color:#1E1005}
.edzone.ed.ed .tool .btn.del,.edzone.ed.ed .btn.del{background:#C2410C;border:0;color:#fff}
.edzone.ed.ed .tool .err{color:#8A1515;font-weight:600}
  </style>

    return '<div class="top"><a class="bk" href="#/stages">‹ Stages</a><h1>' + e(r.id) + " · " + e(r.applicant || "(no name)") + '</h1><span class="sub">' + e(r.fy) + (F.farmNo && filled(r.a[F.farmNo]) ? " · Farm # " + e(r.a[F.farmNo]) : " · no Farm #") + '</span><a class="cbtn" href="' + classicHref(r) + '">Open in the classic view</a>' + (deletable(r) ? '<button type="button" class="dbtn" id="appDel">Delete application…</button>' : "") +
      '<div class="figs">' + figs.map(([v, l]) => "<span><b>" + e(v) + "</b>" + e(l) + "</span>").join("") + "</div></div>" +
      '<div class="edzone ed" id="appTool"></div><div class="sheet"><nav class="srail" aria-label="Stages of this application">' + rail + gridLink(r, false) + "</nav>" +
      '<section class="smid" style="--c:' + SCOL[k - 1] + '"><div class="sh">' + sn(k) + "<div><b>" + e(STAGES[k - 1]) + "</b><span>" + e(k === m.d ? "this is the application's current stage" : k < m.d ? "completed stage" : "not reached yet") + "</span></div>" +
      (k > 1 ? '<a class="nav2" href="#/app/' + encodeURIComponent(r.id) + "/" + (k - 1) + '">‹ ' + e(STAGES[k - 2]) + "</a>" : "") + (k < 6 ? '<a class="nav2 fw" href="#/app/' + encodeURIComponent(r.id) + "/" + (k + 1) + '">' + e(STAGES[k]) + " ›</a>" : "") + "</div>" +
      (docs ? '<div class="docbar">' + docs + "</div>" : "") + noteHtml(r) + flags + needs +
      '<div class="edzone" id="edZone"><div class="pane">' + (k <= 5 ? '<div class="edbar"><label class="showall"><input type="checkbox" id="showAll"' + (showAll ? " checked" : "") + "> Show all fields, including the empty ones</label>" + editBtn(r, k) + "</div>" : "") + body + "</div></div></section>" +
      '<aside class="sctx"><div class="cx"><h2>Fields <a class="lnk2" href="#/app/' + encodeURIComponent(r.id) + '/fields">open the fields grid ›</a></h2>' + ftab + '</div><div class="cx"><h2>Map <button type="button" class="lnk" id="mapBig">' + (SH.mapBig ? "smaller" : "larger") + '</button></h2><div id="sheetMap" class="smap' + (SH.mapBig ? " big" : "") + '"><p class="none">Loading the map…</p></div></div>' +
      '<div class="cx"><h2>Paper for this stage <span id="fileCount"></span></h2><div id="sheetFiles"><p class="none">Reading the attached files…</p></div></div></aside></div>' + footHtml();
  }
  const gridLink = (r, on) => '<a class="rs fl' + (on ? " view" : "") + '" href="#/app/' + encodeURIComponent(r.id) + '/fields"><i class="gi">▦</i><b>Fields grid</b><span>acres, soil, lime, lab</span></a>';
  // ---- the fields grid: every field of the application in one table; Edit opens that field's lab report as a tab joined to its row ----
  function fieldsHtml(m) {
    const r = m.r, e = esc, all = fieldsOf(r), can = canEdit(r) && !!fr.table;
    const ef = (() => { try { return earlierFunding(r).out; } catch { return new Map(); } })();
    const cls = (j) => (j < m.d ? "done" : j === m.d ? "now" : "todo");
    const rail = STAGES.map((s, i) => '<a class="rs ' + cls(i + 1) + '" style="--c:' + SCOL[i] + '" href="#/app/' + encodeURIComponent(r.id) + "/" + (i + 1) + '">' + sn(i + 1) + "<b>" + e(s) + "</b><span>" + (i + 1 < m.d ? "complete" : i + 1 === m.d ? "current" : "not yet") + "</span></a>").join("");
    const v = (x, n, f) => { const t = show(fr.fields[n.toLowerCase()], attr(x, n)); return t == null ? (f ? '<span class="mis">needs input</span>' : "—") : e(t); };
    const body = all.map((x) => { const oid = x[fr.oidField], inc = included(x), hit = ef.get(normKey(attr(x, "FieldNum"))), hasDate = filled(attr(x, "LabReportDate")) || filled(attr(x, "DateSampled"));
      return '<tr data-row="' + e(oid) + '"><td class="fn">' + e(attr(x, "FieldNum") ?? "?") + "</td><td>" + v(x, "FieldStatus") + "</td><td>" + v(x, "TotalAcresInField", inc) + "</td><td>" + v(x, "TreatedAcresInField", inc) + "</td><td>" + v(x, "SoilpH", inc) + "</td><td>" +
        (filled(attr(x, "LimeRecLbPerAcre")) ? v(x, "LimeRecLbPerAcre") + " lb/ac" : filled(attr(x, "LimeRecTonsPerAcre")) ? v(x, "LimeRecTonsPerAcre") + " t/ac" : (inc ? '<span class="mis">needs input</span>' : "—")) + "</td><td>" +
        (hasDate ? (filled(attr(x, "LabReportDate")) ? v(x, "LabReportDate") : v(x, "DateSampled")) : (inc ? '<span class="mis">needs input</span>' : "—")) + "</td><td><b>" + v(x, "TotalTonsForField") + "</b></td><td>" + (hit ? "limed " + e(hit.year ?? "") + " (" + e(hit.id ?? "") + ")" : "clear") + "</td><td>" +
        (can ? '<button type="button" class="gbtn go" data-rowedit="' + e(oid) + '">Edit · lab ›</button> <button type="button" class="gbtn dl" data-rowdel="' + e(oid) + '">Delete…</button>' : "") + '</td></tr><tr class="tl"><td colspan="10"><div class="edzone ed" data-rowtool="' + e(oid) + '"></div></td></tr>'; }).join("");
    const acres = m.flds.reduce((a, x) => a + (num(attr(x, "TreatedAcresInField")) || 0), 0), tons = m.flds.reduce((a, x) => a + (num(attr(x, "TotalTonsForField")) || 0), 0);
    return '<div class="top"><a class="bk" href="#/app/' + encodeURIComponent(r.id) + '">‹ back to the stages</a><h1>Fields · ' + e(r.id) + " · " + e(r.applicant || "(no name)") + '</h1><span class="sub">' + e(r.fy) + (F.farmNo && filled(r.a[F.farmNo]) ? " · Farm # " + e(r.a[F.farmNo]) : "") + '</span><a class="cbtn" href="' + classicHref(r) + '">Open in the classic view</a></div>' +
      '<div class="sheet"><nav class="srail" aria-label="Stages of this application">' + rail + gridLink(r, true) + "</nav>" +
      '<section class="smid" style="--c:#E8742E"><div class="sh"><i class="n" style="--c:#E8742E">▦</i><div><b>Fields grid</b><span>' + all.length + " field" + (all.length === 1 ? "" : "s") + " · the six values the ranking reads, per field</span></div></div>" + noteHtml(r) +
      '<div class="fsum"><span><b>' + m.flds.length + "</b> included</span><span><b>" + fmt(acres) + "</b> treated acres</span><span><b>" + fmt(tons) + "</b> tons</span><span>average pH <b>" + (m.ph != null ? rd1(m.ph) : "—") + "</b></span></div>" +
      (all.length ? '<table class="fgrid" id="fgrid"><tr><th>Field</th><th>Status</th><th>Total ac</th><th>Treated ac</th><th>Soil pH</th><th>Lime rec.</th><th>Lab date</th><th>Tons</th><th>3-year</th><th></th></tr>' + body + "</table>" : '<p class="none2">No fields are entered for this application.</p>') +
      (can ? '<div class="gbar"><button type="button" class="gbtn go" data-rowadd="1">+ Add a field</button><span>Pick the field from the list of the farm\'s fields. Its lab data is then entered with "Edit · lab".</span></div><div class="edzone ed" id="rowTool"></div>' : '<p class="count">' + e(canEdit(r) ? "" : lockWhy(r)) + "</p>") +
      '<div class="edzone joined" id="edZone"><div class="pane"></div></div></section>' +
      '<aside class="sctx"><div class="cx"><h2>Map <button type="button" class="lnk" id="mapBig">' + (SH.mapBig ? "smaller" : "larger") + '</button></h2><div id="sheetMap" class="smap' + (SH.mapBig ? " big" : "") + '"><p class="none">Loading the map…</p></div></div></aside></div>' + footHtml();
  }
  function renderSheet() {
    const parts = location.hash.replace(/^#\/?/, "").split("/"), id = decodeURIComponent(parts[1] || ""), m = MODELS.find((x) => x.r.id === id);
    if (!m) { $("page").innerHTML = '<div class="top"><h1>Application not found</h1></div><div class="cx soonp"><p>No application has the ID "' + esc(id) + '".</p><a class="bt" href="#/stages">Back to Stages</a></div>'; return; }
    curId = m.r.id;
    if (parts[2] === "fields") { curTab = "rows"; $("page").innerHTML = fieldsHtml(m); sheetMap(m).catch(() => {}); return; }
    const k = Math.min(6, Math.max(1, parseInt(parts[2], 10) || m.d));
    curTab = STAGE_FORM[k - 1];
    $("page").innerHTML = sheetHtml(m, k);
    sheetMap(m).catch((e) => { const h = $("sheetMap"); if (h) h.innerHTML = '<p class="none">The map could not be drawn: ' + esc(mask(e.message || e)) + "</p>"; });
    sheetFiles(m, k).catch((e) => { const h = $("sheetFiles"); if (h) h.innerHTML = '<p class="none">The files could not be read: ' + esc(mask(e.message || e)) + "</p>"; });
  }
  async function sheetMap(m) {          // the farm outline, this application's fields, and the farm's other fields in grey
    const r = m.r, host = $("sheetMap"); await loadPolygons(); if (!$("sheetMap") || $("sheetMap") !== host) return;
    const farmNo = F.farmNo ? normFarm(r.a[F.farmNo]) : "", farm = MAPS.farms.find((f) => f.farm === farmNo), flds = MAPS.fields.filter((f) => farmNo && (f.farm === farmNo || f.pre === farmNo));
    if (!farmNo) { host.innerHTML = '<p class="none">This application has no Farm #, so its farm cannot be looked up.</p>'; return; }
    if (!farm && !flds.length) { host.innerHTML = '<p class="none">No farm or field polygon was found for Farm # ' + esc(r.a[F.farmNo]) + ".</p>"; return; }
    const { MapCls, GraphicsLayer, G } = MAPS.mods, lay = new GraphicsLayer(), mine = new Set(m.flds.map((x) => normKey(attr(x, "FieldNum"))));
    if (farm && farm.g) lay.add(new G({ geometry: farm.g, symbol: { type: "simple-fill", color: [0, 0, 0, 0], outline: { color: [255, 255, 255, 0.9], width: 1.6 } } }));
    for (const f of flds) { const on = mine.has(f.key);
      lay.add(new G({ geometry: f.g, symbol: { type: "simple-fill", color: on ? [255, 180, 90, 0.45] : [0, 0, 0, 0], outline: { color: on ? [255, 180, 90, 1] : [220, 220, 220, 0.7], width: on ? 2 : 1 } } }));
      if (on && f.g && f.g.extent) lay.add(new G({ geometry: f.g.extent.center, symbol: { type: "text", text: f.suf, color: "#fff", haloColor: [6, 9, 12, 0.9], haloSize: 2, font: { size: 10, weight: "bold" } } })); }
    host.innerHTML = ""; const el = document.createElement("arcgis-map"); el.map = new MapCls({ basemap: BASES.aerial, layers: [lay] }); host.appendChild(el);
    // zoom to this application's own fields when they are on the map (the whole farm otherwise), so the fields fill the frame
    const own = flds.filter((f) => mine.has(f.key)).map((f) => f.g).filter(Boolean);
    const target = own.length ? own : (farm && farm.g ? farm.g : flds.map((f) => f.g).filter(Boolean));
    const zoom = () => { try { const p = el.goTo && el.goTo(target); if (p && p.catch) p.catch(() => {}); } catch (e) { console.warn("sheet map zoom", e); } };
    el.addEventListener("arcgisViewReadyChange", zoom); setTimeout(zoom, 1500);
  }
  async function sheetFiles(m, k) {      // the attached files that belong to this stage (read and open only, for now)
    const r = m.r, host = $("sheetFiles"), oid = r.a[appLayer.objectIdField];
    if (SH.forId !== r.id) { SH.files = null; SH.forId = r.id;
      SH.files = (typeof appLayer.queryAttachments === "function" && oid != null) ? (((await appLayer.queryAttachments({ objectIds: [oid] })) || {})[oid] || []) : []; }
    if (!$("sheetFiles") || $("sheetFiles") !== host || SH.forId !== r.id) return;
    SH.k = k;
    const kw = (f) => String(Array.isArray(f.keywords) ? f.keywords.join(", ") : f.keywords ?? "").trim();
    const groupOf = (f) => { const t = kw(f); return t ? DOC_GROUPS.find(([, , re]) => re.test(t))[0] : "other"; };
    const all = SH.files || [], want = STAGE_FILES[k - 1], list = all.filter((f) => want.includes(groupOf(f)));
    const title = (g) => (DOC_GROUPS.find((x) => x[0] === g) || [0, g])[1];
    $("fileCount").textContent = list.length + " of " + all.length + " attached file" + (all.length === 1 ? "" : "s");
    host.innerHTML = (list.map((f) => '<div class="pp"><span>' + esc(f.name || "(no name)") + "<small>" + esc(title(groupOf(f)) + (f.size != null ? " · " + sizeText(f.size) : "")) + '</small></span><button type="button" class="lnk" data-file="' + all.indexOf(f) + '">open</button></div>').join("") || '<p class="none">No file is attached for this stage.</p>') +
      '<p class="wnote">Attaching and removing files: in the classic view for now.</p>';
  }
  document.addEventListener("change", (e) => { if (e.target.id !== "showAll") return; showAll = e.target.checked; try { localStorage.setItem("wccdDashShowAll", showAll ? "1" : "0"); } catch { /* ignore */ } renderSheet(); });
  document.addEventListener("click", async (e) => {
    const pr = e.target.closest(".pbtn[data-pr]"); if (pr && !pr.disabled) { const id = decodeURIComponent(location.hash.split("/")[2] || ""), r = rows.find((x) => x.id === id); if (r) prOpen(r, pr.dataset.pr); return; }
    if (e.target.id === "mapBig") { SH.mapBig = !SH.mapBig; renderSheet(); return; }
    const fb = e.target.closest("[data-file]"); if (!fb || !SH.files) return;
    const f = SH.files[Number(fb.dataset.file)]; if (!f) return;
    // Same way as the classic view: the app fetches the file while signed in and shows the copy, so no link on the page carries a sign-in token.
    const inTab = /pdf|^image\//i.test(f.contentType || ""), w = inTab ? window.open("", "_blank") : null, old = fb.textContent;
    try { fb.disabled = true; fb.textContent = "opening…";
      const esriRequest = await $arcgis.import("@arcgis/core/request.js");
      const res = await esriRequest(f.url, { responseType: "blob" });
      const blob = f.contentType && res.data.type !== f.contentType ? new Blob([res.data], { type: f.contentType }) : res.data, url = URL.createObjectURL(blob);
      if (w) w.location = url; else { const a = document.createElement("a"); a.href = url; a.download = f.name || "file"; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(() => URL.revokeObjectURL(url), 600000);
    } catch (err) { if (w) w.close(); fb.insertAdjacentHTML("afterend", '<small class="mis"> could not be opened – ' + esc(mask(err.message || err)) + "</small>"); }
    finally { fb.disabled = false; fb.textContent = old; }
  });

  // =====================================================================================================================
  // Piece 3: editing on the application page. The editor itself (the form's own rules, the review panel, the safe save:
  // last-edited check, write only the planned fields, read back and verify) is the classic app's code, copied unchanged.
  // This part only places it in the page: the Edit button, the buttons it listens for, and what is shown after a save.
  // =====================================================================================================================
  // The copied born-values loader calls these two when it has read the survey's rules file. Here there is nothing to redraw yet (New application is piece 5).
  function aboutDraw() {}
  function naOpen() {}
  bornLoad();
  const editBtn = (r, k) => { const tab = STAGE_FORM[k - 1]; if (!tab || !EDIT_TABS.includes(tab)) return "";
    return canEdit(r) ? '<button type="button" class="pbtn" id="edOpen">Edit this stage</button>' : '<span class="locknote">' + esc(lockWhy(r)) + "</span>"; };
  const noteHtml = (r) => { if (!saveNote || saveNote.id !== r.id) return ""; const n = saveNote; saveNote = null;
    return '<div class="savenote ' + (n.cls === "okmsg" ? "ok" : "bad") + '" role="status">' + esc(n.text).replace(/\n/g, "<br>") + "</div>"; };
  // The classic editor calls renderWork(id) when it has saved and re-read the applications: here that means redrawing the page at the stage that was edited.
  function renderWork(id) {
    MODELS = rows.map(model);
    const k = Math.max(1, STAGE_FORM.indexOf(curTab) + 1), want = "#/app/" + encodeURIComponent(id) + "/" + (curTab === "rows" ? "fields" : k);
    SH.forId = null;
    if (location.hash !== want) history.replaceState(null, "", want);
    renderSheet();
  }
  document.addEventListener("click", (e) => {
    const d = $("detail"); if (!d || !d.contains(e.target)) return;
    const id = e.target.id, r = rows.find((x) => x.id === curId);
    const rs = e.target.closest("[data-restore]");
    if (rs && ed && ed.own) { OWN.restore(rs.dataset.restore); return; }
    const re = e.target.closest("[data-rowedit]");
    if (re && r && !ed) {            // a field's lab report opens as a tab joined to its row; the other rows are dimmed until it is closed
      for (const tr of document.querySelectorAll("#fgrid tr[data-row]")) tr.className = tr.dataset.row === re.dataset.rowedit ? "sel" : "dim";
      const sel = document.querySelector("#fgrid tr.sel"), zone = $("edZone"); if (sel && zone) { const host = sel.nextElementSibling.firstElementChild; host.appendChild(zone); }
      for (const b of document.querySelectorAll("#fgrid .gbtn, [data-rowadd]")) b.disabled = true;
      $("edZone").classList.add("ed"); OWN.open(r, "rows", re.dataset.rowedit); setTimeout(() => { try { $("edZone").scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch { /* ignore */ } }, 300); return; }
    if (id === "edOpen" && r && !ed) { $("edZone").classList.add("ed"); OWN.open(r, curTab); }
    else if (id === "edCancel") { if (leaveEdit()) renderSheet(); }
    else if (id === "edSave" && ed && ed.ready) OWN.review();
    else if (id === "edBack" && ed) OWN.back();
    else if (id === "edConfirm" && ed) OWN.confirm();
  });
  for (const ev of ["input", "change"]) document.addEventListener(ev, () => { for (const w of document.querySelectorAll(".stabs")) stMarks(w); });
  // Leaving the page while a stage is being edited: ask first, exactly as the classic view does.
  let lastHash = location.hash;
  window.addEventListener("hashchange", (e) => { if (ed && !leaveEdit()) { e.stopImmediatePropagation(); history.replaceState(null, "", lastHash); return; } lastHash = location.hash; }, true);

  // ---- routes ----
  function dRoute() {
    const h = location.hash.replace(/^#\/?/, "").split("/")[0] || "home"; HM = null;
    MODELS = rows.map(model);            // always from the applications as last read (they are re-read after every save, add or delete)
    document.querySelectorAll(".rail a[data-r]").forEach((a) => a.classList.toggle("on", a.dataset.r === (h === "app" ? "stages" : h)));
    if (h === "home") renderHome(); else if (h === "stages") renderStages(); else if (h === "app") renderSheet(); else renderSoon({ explore: "Explore", reports: "Reports", check: "Data check", help: "Help" }[h] || "Page");
  }
  document.addEventListener("change", (e) => { if (e.target.id !== "fySel") return; fyPick = e.target.value; try { sessionStorage.setItem("wccdDashFy", fyPick); } catch { /* ignore */ } dRoute(); });
  // Data check is shown only to the administrator: the owner of the web map the app reads.
  try { $("navCheck").hidden = !(webmap.portalItem && webmap.portalItem.owner && webmap.portalItem.owner === portalRef.user.username); } catch { $("navCheck").hidden = true; }
  $("status").hidden = true;
  window.addEventListener("hashchange", dRoute);
  dRoute();
</script>

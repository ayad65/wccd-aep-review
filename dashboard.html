<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WCCD lime applications · Dashboard view</title>
  <!-- Dashboard view, piece 1 (D1a). Data code copied unchanged from the classic app, build B13k. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <script type="module" src="https://js.arcgis.com/5.2/"></script>
  <style>
:root{--bg:#0B0F12;--panel:#131A20;--panel2:#1B242C;--line:#26303A;--line2:#4A5866;--ink:#F2EFE9;--dim:#9AA7B3;--acc:#FFB45A;--acc2:#F08C00;--warn:#FF9C8A;--warnbg:#2A1A18;--red:#FF5A3C;
  --s1:#E4572E;--s2:#F0A202;--s3:#9BC53D;--s4:#1B8A5A;--s5:#0B7C8A;--s6:#2A4FA8}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans","Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:78px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;align-items:center;border-right:1px solid var(--line);padding:12px 0}
.rail img{width:44px;margin-bottom:10px}.rail a{width:62px;padding:7px 0;border-radius:9px;text-align:center;font-size:11px;color:var(--dim);font-weight:600}
.rail a svg{display:block;margin:0 auto 2px;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail a.on{background:rgba(255,180,90,.16);color:var(--acc)}.rail a:hover{color:var(--ink)}.rail a.soon{opacity:.45}.rail .sp{flex:1}.rail a.cl{border:1px dashed var(--line2)}
main{padding:14px 18px 40px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font:700 22px "Barlow Semi Condensed",sans-serif;margin:0}.top .sub{color:var(--dim);font-size:12.5px}
.top select{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font:inherit}
.figs{margin-left:auto;display:flex;gap:24px}.figs span{font-size:11.5px;color:var(--dim);text-align:right}.figs b{display:block;font:700 22px "Barlow Semi Condensed",sans-serif;color:var(--acc)}
.util{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--dim);margin-bottom:6px}.util button{background:none;border:1px solid var(--line2);border-radius:12px;padding:2px 10px;font-size:12px}
#status{padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}#status.error{border-color:var(--red);color:var(--warn)}
.n{font-style:normal;display:inline-flex;border-radius:50%;background:var(--c);color:#fff;font-weight:700;align-items:center;justify-content:center;flex:none;width:24px;height:24px;font-size:13px}
.cx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.cx h2{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}.cx h2 span{font-weight:400;color:var(--dim);font-size:11.5px}
.homeg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}.mapc{position:relative;background:#06090C;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(62vh,640px);min-height:380px}
#homeMap{position:absolute;inset:0}#homeMap arcgis-map{display:block;width:100%;height:100%}
.mleg{position:absolute;left:10px;bottom:22px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(11,15,18,.82);padding:6px 10px;border-radius:9px;font-size:11.5px;z-index:2;max-width:calc(100% - 20px)}.mleg span{display:flex;gap:5px;align-items:center}.mleg .n{width:18px;height:18px;font-size:10px}
.msw{position:absolute;right:10px;top:10px;display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--bg);z-index:2}.msw button{padding:5px 11px;font-size:12px;font-weight:600;color:var(--dim);background:none;border:0}.msw button[aria-pressed=true]{background:var(--acc);color:#1E1005}
.mnote{position:absolute;left:10px;top:10px;background:rgba(11,15,18,.82);padding:5px 10px;border-radius:9px;font-size:11.5px;color:var(--dim);z-index:2;max-width:60%}
.hside{display:flex;flex-direction:column;gap:12px;min-height:0}.needc{overflow:auto;max-height:min(46vh,480px)}
.need{display:grid;grid-template-columns:26px 1fr;gap:0 8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}.need .n{grid-row:1/3;align-self:center;width:22px;height:22px;font-size:12px}.need b{color:#fff}.need em{grid-column:2;font-style:normal;color:var(--warn);font-size:12px}.need:hover b{color:var(--acc)}
.none{color:var(--dim);font-size:12.5px;padding:6px 0}
.bt{display:block;border:1px solid var(--line2);border-radius:18px;padding:8px 12px;text-align:center;font-weight:600;font-size:13px;margin-top:6px;background:none;width:100%}.bt.pri{background:linear-gradient(180deg,#FFB45A,#F08C00);color:#1E1005;border:0}
.stripc{margin-top:12px;background:none;border-color:#1E2830}.stripc h2{color:#C9D2DA}.hint{transition:opacity .8s}.hint.gone{opacity:0}
.strip{position:relative;height:138px;margin:2px 24px 0}.band{position:absolute;left:0;right:0;bottom:26px;height:12px;border-radius:6px;background:linear-gradient(90deg,#7A4A22,#FFB45A 55%,#FFE9B8);opacity:.8}
.strip>span{position:absolute;bottom:4px;transform:translateX(-50%);font-size:11px;color:var(--dim)}
.mk{position:absolute;bottom:38px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0}
.mk em{font-style:normal;font-size:10.5px;color:var(--dim);white-space:nowrap;margin-bottom:3px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.mk b{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:2px solid var(--acc);color:var(--acc);font-size:11px;display:flex;align-items:center;justify-content:center;transition:transform .18s,box-shadow .18s}
.mk u{display:block;width:1px;height:var(--h);background:rgba(255,255,255,.4)}
.mk:hover{z-index:9}.mk:hover b,.mk:focus-visible b{transform:scale(1.28);box-shadow:0 0 18px 3px var(--acc)}.mk:hover em{color:#fff}
.tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--acc);border-radius:9px;padding:8px 10px;z-index:8;min-width:170px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.6);text-align:left}
.tip strong{display:block;color:#fff;font-size:12.5px;margin-bottom:3px;white-space:nowrap}.tip span{display:flex;justify-content:space-between;gap:14px;color:#C9D2DA;white-space:nowrap}.tip span i{color:var(--acc);font-style:normal}.tip small{display:block;margin-top:4px;color:var(--dim);border-top:1px solid var(--line);padding-top:3px;font-size:11px}
.mk:hover .tip,.mk:focus-visible .tip{display:block}
.board{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:8px;overflow-x:auto}.bcol{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:8px;min-height:300px}
.bh{display:flex;align-items:center;gap:6px;margin-bottom:8px}.bh .n{width:28px;height:28px;font-size:15px}.bh span{color:var(--dim);font-size:12px}
.bc{display:block;background:var(--panel2);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;border-left:4px solid transparent}.bc b{display:block;font-size:11px;color:var(--dim)}.bc:hover{outline:1px solid var(--acc)}
.bc.need2{border-left-color:var(--red);background:var(--warnbg)}.bc ul{margin:4px 0 0;padding-left:15px;color:var(--warn);font-size:11.5px}.bc .tag{display:inline-block;font-size:10.5px;color:var(--dim);border:1px solid var(--line2);border-radius:8px;padding:0 6px;margin-top:3px}
.bcnone{border:1px dashed var(--line2);color:var(--dim);text-align:center;border-radius:8px;padding:7px;font-size:12px}
.wnote{font-size:12px;color:var(--dim);margin:10px 2px 0}.foot{margin-top:18px;font-size:11.5px;color:var(--dim)}
.soonp{max-width:560px}.soonp p{color:var(--dim)}
@media (max-width:900px){.homeg{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:6px}.rail img{margin:0 6px 0 0;width:34px}.rail .sp{display:none}.figs{margin-left:0}}
@media (prefers-reduced-motion:reduce){.mk b,.hint{transition:none}}
  </style>
</head>

      MAPS.fields = (await q(got.fields)).map((f) => { const [pre, suf] = splitFieldId(A(f, "FieldID")); return { g: f.geometry, id: A(f, "FieldID"), farm: normFarm(A(f, "FarmID") ?? pre), pre: normFarm(pre), suf: suf.trim(), key: normKey(suf), acres: A(f, "TotalAcresInField") }; });
      MAPS.farms = (await q(got.farms)).map((f) => ({ g: f.geometry, farm: normFarm(A(f, "FarmID")), no: A(f, "FarmID"), name: A(f, "FarmName"), gid: A(f, "GlobalID") }));
    })().catch((e) => { MAPS.error = mask(e.message || e); MAPS.ready = null; throw e; });
    return MAPS.ready;
  }
  const BASES = { topo: "topo-vector", aerial: "hybrid" };
  const BUILD = "B13k";
  // ##### END OF THE COPIED CODE #####

  // =====================================================================================================================
  // Dashboard view, piece 1 (D1a): Home and Stages, read-only. Everything above this line is copied unchanged from the
  // classic app (index.html) by build_dash.py: settings, sign-in, reading the applications, the forms and the field rows,
  // the flags, and the farm and field polygons. Nothing here writes to ArcGIS Online.
  // =====================================================================================================================
  const D_BUILD = "D1a", D_DATE = "18 Nov 2026", CLASSIC = "index.html";
  const SCOL = ["#E4572E", "#F0A202", "#9BC53D", "#1B8A5A", "#0B7C8A", "#2A4FA8"];
  const nb = (k, cls) => '<i class="n' + (cls ? " " + cls : "") + '" style="--c:' + SCOL[k - 1] + '">' + k + "</i>";
  const filled = (v) => v != null && String(v).trim() !== "";
  const rd1 = (n) => Math.round(n * 10) / 10;

  // ---- what each application still needs, and the column it sits in ----
  const RANK_Q = [["EligibilityMet", "eligibility"], ["Q02ConsPlanVerified", "2"], ["Q04ActPlanVerified", "4"], ["Q05FirstTime", "5"], ["Q07AllPasture", "7"], ["Q10DistrictVisit", "10"]];
  const fieldsOf = (r) => (fr.rows || []).filter((x) => normId(x[fr.parent]) === normId(r.gid) && normId(r.gid) !== "");
  const included = (x) => { const s = String(attr(x, "FieldStatus") ?? ""); return s === "" || /^included$/i.test(s); };
  function model(r) {
    const flds = fieldsOf(r).filter(included), need = [];
    // Intake: the values the ranking and the three-year check read
    const intake = [];
    if (F.farmNo && !filled(r.a[F.farmNo])) intake.push("Farm #");
    if (fr.rows && !flds.length) intake.push("no fields yet");
    for (const x of flds) { const miss = [];
      if (!filled(attr(x, "SoilpH"))) miss.push("soil pH");
      if (!filled(attr(x, "LimeRecLbPerAcre")) && !filled(attr(x, "LimeRecTonsPerAcre"))) miss.push("lime recommendation");
      if (!filled(attr(x, "LabReportDate")) && !filled(attr(x, "DateSampled"))) miss.push("lab date");
      if (!filled(attr(x, "TreatedAcresInField"))) miss.push("treated acres");
      if (miss.length) intake.push("field " + (attr(x, "FieldNum") ?? "?") + ": " + miss.join(", ")); }
    const unans = RANK_Q.filter(([n]) => !filled(attr(r.a, n))).map(([, t]) => t);
    // The column: the classic rules (ranked = the reviewer's answers are stored; signed = both signature dates are stored), plus Intake / Ranking split by what Intake still needs.
    let d;
    if (r.closed) d = 6; else if (r.stageN === 5 || r.signed) d = 5; else if (r.stageN >= 3) d = 4; else if (r.ranked) d = 3; else d = intake.length ? 1 : 2;
    if (d === 1) need.push(...intake);
    if (d === 2 && unans.length && unans.length < RANK_Q.length) need.push("ranking started: still " + unans.map((t) => t === "eligibility" ? t : "question " + t).join(", "));
    if (d >= 2 && d < 6 && intake.length) need.push(...intake);
    const phs = flds.map((x) => num(attr(x, "SoilpH"))).filter((v) => v != null);
    const tons = num(attr(r.a, "AmountRequestedTons")) ?? num(r.a[F.rankTons]);
    return { r, d, need, checks: r.red.filter((t) => !/^No Farm #|^No field rows/.test(t)), flds, ph: phs.length ? phs.reduce((a, b) => a + b, 0) / phs.length : null, tons };
  }
  let MODELS = rows.map(model), fyPick = "";
  const years = [...new Set(rows.map((r) => r.fy))].filter((y) => y && y !== "—").sort();
  try { fyPick = sessionStorage.getItem("wccdDashFy") ?? ""; } catch { /* ignore */ }
  if (fyPick !== "all" && !years.includes(fyPick)) fyPick = years[years.length - 1] || "all";
  const shown = () => MODELS.filter((m) => fyPick === "all" || m.r.fy === fyPick);
  const openHref = (r) => CLASSIC + "#/work/" + encodeURIComponent(r.id);
  const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

  // ---- page frame ----
  const topHtml = (title, sub, figs) => '<div class="top"><h1>' + esc(title) + '</h1><span class="sub">' + esc(sub) + '</span><label class="sub">Fiscal year <select id="fySel">' +
    years.map((y) => '<option value="' + esc(y) + '"' + (y === fyPick ? " selected" : "") + ">" + esc(y) + "</option>").join("") + '<option value="all"' + (fyPick === "all" ? " selected" : "") + ">All years</option></select></label>" +
    '<div class="figs">' + figs.map(([v, l]) => "<span><b>" + esc(v) + "</b>" + esc(l) + "</span>").join("") + "</div></div>";
  const footHtml = () => '<p class="foot">Dashboard view, build ' + D_BUILD + " (" + D_DATE + "), read-only so far. Opening an application uses the classic view until its new page is built. Classic app build " + esc(typeof BUILD === "string" ? BUILD : "B13k") + " · ArcGIS SDK " + esc(sdkVer) + ". Problems: yayad@pennwest.edu</p>";

  // ---- Home ----
  function needHtml(list) {
    const items = list.filter((m) => m.need.length && m.d < 6).sort((a, b) => a.d - b.d);
    if (!items.length) return '<p class="none">Nothing is missing on the applications shown.</p>';
    return items.map((m) => '<a class="need" href="' + openHref(m.r) + '">' + nb(m.d) + "<span><b>" + esc(m.r.id) + "</b> " + esc(m.r.applicant) + "</span><em>" + esc(m.need.join(" · ")) + "</em></a>").join("");
  }
  function stripHtml(list) {
    const pts = list.filter((m) => m.ph != null).sort((a, b) => a.ph - b.ph), lo = 4.5, hi = 7.5, pos = (v) => Math.min(100, Math.max(0, (v - lo) / (hi - lo) * 100));
    const ticks = [4.5, 5, 5.5, 6, 6.5, 7, 7.5].map((k) => '<span style="left:' + pos(k) + '%">' + k.toFixed(1) + "</span>").join("");
    const dots = pts.map((m, i) => '<a class="mk" href="' + openHref(m.r) + '" style="left:' + pos(m.ph).toFixed(1) + "%;--h:" + (14 + (i % 3) * 26) + 'px" aria-label="' + esc(m.r.applicant + ", average soil pH " + rd1(m.ph) + ", " + m.flds.length + " fields") + '"><em>' + esc(short(m.r.applicant, 22)) + "</em><b>" + m.flds.length + "</b><u></u>" +
      '<div class="tip"><strong>' + esc(m.r.applicant) + "</strong>" + m.flds.map((x) => "<span>field " + esc(attr(x, "FieldNum") ?? "?") + "<i>" + (filled(attr(x, "SoilpH")) ? "pH " + esc(attr(x, "SoilpH")) : "no soil test yet") + "</i></span>").join("") + "<small>average " + rd1(m.ph) + " · " + esc(m.r.id) + "</small></div></a>").join("");
    const out = list.filter((m) => m.ph == null).length;
    return '<div class="cx stripc"><h2>Soil pH of every application <span class="hint" id="stripHint">each dot is an application at its fields\' average · the number is its count of fields · point at a dot for its fields</span></h2>' +
      (pts.length ? '<div class="strip"><div class="band"></div>' + ticks + dots + "</div>" : '<p class="none">No soil pH is entered yet for the applications shown.</p>') +
      (out ? '<p class="wnote">' + out + " application" + (out === 1 ? " has" : "s have") + " no soil pH yet and " + (out === 1 ? "is" : "are") + " not on the strip.</p>" : "") + "</div>";
  }
  function renderHome() {
    const list = shown(), open = list.filter((m) => m.d < 6), needing = open.filter((m) => m.need.length), tons = list.reduce((a, m) => a + (m.tons || 0), 0);
    const counts = [1, 2, 3, 4, 5, 6].map((k) => list.filter((m) => m.d === k).length);
    $("page").innerHTML = topHtml("Lime applications", "Washington County Conservation District · Agricultural Enhancement Program", [[String(open.length), "open"], [String(needing.length), "need input"], [fmt(tons) + " t", "requested"]]) +
      '<div class="homeg"><div class="mapc"><div id="homeMap"></div><div class="mnote" id="mapNote">Loading the map…</div>' +
      '<div class="msw" role="group" aria-label="Background"><button type="button" data-bm="aerial" aria-pressed="true">Aerial</button><button type="button" data-bm="topo" aria-pressed="false">Topo</button></div>' +
      '<div class="mleg">' + STAGES.map((s, i) => "<span>" + nb(i + 1) + esc(s) + " " + counts[i] + "</span>").join("") + "</div></div>" +
      '<div class="hside"><div class="cx needc"><h2>Needs input <span>' + needing.length + " application" + (needing.length === 1 ? "" : "s") + "</span></h2>" + needHtml(list) + "</div>" +
      '<div class="cx"><h2>Start</h2><a class="bt pri" href="' + CLASSIC + '#/new">New application</a><a class="bt" href="#/stages">Open the Stages page</a></div></div></div>' + stripHtml(list) + footHtml();
    const h = $("stripHint"); if (h) setTimeout(() => h.classList.add("gone"), 6000);
    homeMap(list).catch((e) => { console.warn("home map", e); const n = $("mapNote"); if (n) n.textContent = "The map could not be drawn: " + mask(e.message || e); });
  }

  // ---- the home map: one numbered point per application, on its own farm ----
  const pinCache = {};
  function pinUrl(k) {           // a circle with the stage number drawn in its exact centre
    if (pinCache[k]) return pinCache[k];
    const s = 64, c = document.createElement("canvas"); c.width = c.height = s; const x = c.getContext("2d");
    x.beginPath(); x.arc(32, 32, 29, 0, 7); x.strokeStyle = SCOL[k - 1]; x.globalAlpha = 0.55; x.lineWidth = 2; x.stroke(); x.globalAlpha = 1;
    x.beginPath(); x.arc(32, 32, 20, 0, 7); x.fillStyle = SCOL[k - 1]; x.fill(); x.lineWidth = 4; x.strokeStyle = "#06090C"; x.stroke();
    x.fillStyle = "#fff"; x.font = "700 24px 'Public Sans', Arial, sans-serif"; x.textAlign = "center"; x.textBaseline = "alphabetic";
    const t = String(k), mt = x.measureText(t), asc = mt.actualBoundingBoxAscent ?? 17, desc = mt.actualBoundingBoxDescent ?? 0;
    x.fillText(t, 32, 32 + (asc - desc) / 2);
    return (pinCache[k] = c.toDataURL("image/png"));
  }
  let HM = null, bmKind = "aerial";
  const DARK = "brightness(0.8) contrast(1.12)";
  function shade(el) { try { const b = el.map.basemap; if (!b || !b.baseLayers) return; b.baseLayers.forEach((l) => { l.effect = bmKind === "aerial" ? DARK : "brightness(0.55) saturate(0.7)"; }); } catch (e) { console.warn("shade", e); } }
  async function homeMap(list) {
    const host = $("homeMap"); if (!host) return;
    await loadPolygons();
    const { MapCls, GraphicsLayer, G } = MAPS.mods;
    const farmsL = new GraphicsLayer({ minScale: 150000 }), pinsL = new GraphicsLayer(), namesL = new GraphicsLayer({ minScale: 250000 });
    const byFarm = new Map(MAPS.farms.map((f) => [f.farm, f])); let placed = 0; const off = [], seen = new Map(), usedFarms = new Set();
    list.forEach((m, i) => {
      const fno = F.farmNo ? normFarm(m.r.a[F.farmNo]) : "", farm = fno && byFarm.get(fno);
      if (!farm || !farm.g || !farm.g.extent) { off.push(m); return; }
      const c = farm.g.extent.center, k = seen.get(fno) || 0; seen.set(fno, k + 1); usedFarms.add(fno);
      // several applications on one farm: fanned out a little so each stays clickable
      const geometry = { type: "point", x: c.x + k * 420, y: c.y - k * 260, spatialReference: farm.g.spatialReference || { wkid: 3857 } };
      pinsL.add(new G({ geometry, attributes: { mi: i }, symbol: { type: "picture-marker", url: pinUrl(m.d), width: 30, height: 30 } }));
      namesL.add(new G({ geometry, symbol: { type: "text", text: short(m.r.applicant, 28), color: "#fff", haloColor: [6, 9, 12, 0.92], haloSize: 2, font: { size: 10, weight: "bold" }, xoffset: 18, yoffset: -4, horizontalAlignment: "left" } }));
      placed++;
    });
    for (const f of MAPS.farms) if (usedFarms.has(f.farm) && f.g) farmsL.add(new G({ geometry: f.g, symbol: { type: "simple-fill", color: [255, 180, 90, 0.14], outline: { color: [255, 190, 110, 1], width: 2 } } }));
    host.innerHTML = "";
    const el = document.createElement("arcgis-map");
    el.map = new MapCls({ basemap: BASES[bmKind], layers: [farmsL, pinsL, namesL] });
    el.center = [-80.25, 40.19]; el.zoom = 10.6;
    host.appendChild(el); HM = { el, list };
    const note = $("mapNote");
    if (note) note.textContent = placed + " of " + list.length + " application" + (list.length === 1 ? "" : "s") + " on the map" + (off.length ? " · " + off.length + " without a farm on the map" : "") + " · zoom in to see names and farm outlines";
    const ready = () => { shade(el); };
    el.addEventListener("arcgisViewReadyChange", ready); setTimeout(ready, 1500); setTimeout(ready, 4000);
    el.addEventListener("arcgisViewClick", async (evt) => { try { const hit = await el.hitTest(evt.detail), g = hit && hit.results && hit.results.map((x) => x.graphic).find((x) => x && x.attributes && x.attributes.mi != null);
      if (g) location.href = openHref(list[g.attributes.mi].r); } catch (e) { console.warn("home map click", e); } });
    // the county outline, and the opening view fitted to it (a failure here leaves the map as it is)
    try {
      const [FeatureLayer] = await $arcgis.import(["@arcgis/core/layers/FeatureLayer.js"]);
      const county = new FeatureLayer({ url: "https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/USA_Counties_Generalized_Boundaries/FeatureServer/0", definitionExpression: "NAME = 'Washington County' AND STATE_ABBR = 'PA'",
        renderer: { type: "simple", symbol: { type: "simple-fill", color: [255, 180, 90, 0.03], outline: { color: [255, 180, 90, 0.9], width: 1.6 } } }, popupEnabled: false, legendEnabled: false });
      await county.load(); el.map.add(county, 0);
      const ext = await county.queryExtent();
      if (ext && ext.extent && el.goTo) { const p = el.goTo(ext.extent.expand(1.06)); if (p && p.catch) p.catch(() => {}); }
    } catch (e) { console.warn("county outline", e); }
  }
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-bm]"); if (!b || !HM) return; bmKind = b.dataset.bm;
    document.querySelectorAll("[data-bm]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    try { HM.el.map.basemap = BASES[bmKind]; const bm = HM.el.map.basemap; if (bm && bm.load) bm.load().then(() => shade(HM.el)).catch(() => {}); setTimeout(() => shade(HM.el), 1200); } catch (err) { console.warn("basemap", err); } });

  // ---- Stages ----
  function renderStages() {
    const list = shown();
    const card = (m) => '<a class="bc' + (m.need.length ? " need2" : "") + '" href="' + openHref(m.r) + '"><b>' + esc(m.r.id) + "</b>" + esc(m.r.applicant || "(no name)") +
      (m.need.length ? "<ul>" + m.need.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>" : "") +
      (m.d === 6 ? '<span class="tag">' + esc(m.r.ended ? m.r.statusText : (m.r.plain[0] || "Closed")) + "</span>" : "") +
      (m.checks.length ? '<span class="tag" title="' + esc(m.checks.join(" ")) + '">' + m.checks.length + " check" + (m.checks.length === 1 ? "" : "s") + "</span>" : "") + "</a>";
    $("page").innerHTML = topHtml("Stages", "every application in stage order", [[String(list.length), "applications"], [String(list.filter((m) => m.need.length && m.d < 6).length), "need input"]]) +
      '<div class="board">' + STAGES.map((s, i) => { const col = list.filter((m) => m.d === i + 1);
        return '<div class="bcol" style="--c:' + SCOL[i] + '"><div class="bh">' + nb(i + 1) + "<b>" + esc(s) + "</b><span>" + col.length + "</span></div>" + (col.map(card).join("") || '<div class="bcnone">none</div>') + "</div>"; }).join("") + "</div>" +
      '<p class="wnote">A card opens the application. A red card lists what is still missing. "checks" are the red flags of the classic view (point at the tag to read them).</p>' + footHtml();
  }
  function renderSoon(name) {
    $("page").innerHTML = '<div class="top"><h1>' + esc(name) + '</h1></div><div class="cx soonp"><h2>Not built yet</h2><p>This page of the Dashboard view comes in a later piece. Until then, use the classic view.</p><a class="bt pri" href="' + CLASSIC + '">Open the classic view</a></div>' + footHtml();
  }

  // ---- routes ----
  function dRoute() {
    const h = location.hash.replace(/^#\/?/, "").split("/")[0] || "home"; HM = null;
    document.querySelectorAll(".rail a[data-r]").forEach((a) => a.classList.toggle("on", a.dataset.r === h));
    if (h === "home") renderHome(); else if (h === "stages") renderStages(); else renderSoon({ explore: "Explore", reports: "Reports", check: "Data check", help: "Help" }[h] || "Page");
  }
  document.addEventListener("change", (e) => { if (e.target.id !== "fySel") return; fyPick = e.target.value; try { sessionStorage.setItem("wccdDashFy", fyPick); } catch { /* ignore */ } dRoute(); });
  // Data check is shown only to the administrator: the owner of the web map the app reads.
  try { $("navCheck").hidden = !(webmap.portalItem && webmap.portalItem.owner && webmap.portalItem.owner === portalRef.user.username); } catch { $("navCheck").hidden = true; }
  $("status").hidden = true;
  window.addEventListener("hashchange", dRoute);
  dRoute();
</script>
</body>

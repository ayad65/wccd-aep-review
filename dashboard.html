<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WCCD lime applications · Dashboard view</title>
  <!-- Dashboard view, pieces 1 to 7 (D9e). Data code copied unchanged from the classic app, build B13k. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <script type="module" src="https://js.arcgis.com/5.2/"></script>
  <style>
:root{--bg:#0B0E13;--panel:#151A22;--panel2:#1F2630;--line:#323B49;--line2:#4A5566;--ink:#F6F7F9;--dim:#9CA5B2;--acc:#FFC043;--acc2:#FF8A1F;--warn:#FF9C8A;--warnbg:#2A1A18;--red:#FF5A3C;
  --s1:#E4572E;--s2:#F0A202;--s3:#9BC53D;--s4:#1B8A5A;--s5:#0B7C8A;--s6:#2A4FA8}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans","Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:78px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;align-items:center;border-right:1px solid var(--line);padding:12px 0}
.rail img{width:44px;margin-bottom:10px}.rail a{width:62px;padding:7px 0;border-radius:9px;text-align:center;font-size:11px;color:var(--dim);font-weight:600}
.rail a svg{display:block;margin:0 auto 2px;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail a.on{background:rgba(255,180,90,.16);color:var(--acc)}.rail a:hover{color:var(--ink)}.rail a.soon{opacity:.45}.rail .sp{flex:1}.rail a.cl{border:1px dashed var(--line2)}
main{padding:14px 18px 40px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font:700 22px "Barlow Semi Condensed",sans-serif;margin:0}.top .sub{color:var(--dim);font-size:12.5px}
.top select{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font:inherit}
.figs{margin-left:auto;display:flex;gap:24px}.figs span{font-size:11.5px;color:var(--dim);text-align:right}.figs b{display:block;font:700 22px "Barlow Semi Condensed",sans-serif;color:var(--acc)}
.util{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--dim);margin-bottom:6px}.util button{background:none;border:1px solid var(--line2);border-radius:12px;padding:2px 10px;font-size:12px}
#status{padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}#status.error{border-color:var(--red);color:var(--warn)}
.n{font-style:normal;display:inline-flex;border-radius:50%;background:var(--c);color:#fff;font-weight:700;align-items:center;justify-content:center;flex:none;width:24px;height:24px;font-size:13px}
.cx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.cx h2{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}.cx h2 span{font-weight:400;color:var(--dim);font-size:11.5px}
.homeg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}.mapc{position:relative;background:#06090C;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(62vh,640px);min-height:380px}
#homeMap{position:absolute;inset:0}#homeMap arcgis-map{display:block;width:100%;height:100%}
.mleg{position:absolute;left:10px;bottom:22px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(11,15,18,.82);padding:6px 10px;border-radius:9px;font-size:11.5px;z-index:2;max-width:calc(100% - 20px)}.mleg span{display:flex;gap:5px;align-items:center}.mleg .n{width:18px;height:18px;font-size:10px}
.msw{position:absolute;right:10px;top:10px;display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--bg);z-index:2}.msw button{padding:5px 11px;font-size:12px;font-weight:600;color:var(--dim);background:none;border:0}.msw button[aria-pressed=true]{background:var(--acc);color:#1E1005}
.mnote{position:absolute;left:10px;top:10px;background:rgba(11,15,18,.82);padding:5px 10px;border-radius:9px;font-size:11.5px;color:var(--dim);z-index:2;max-width:60%}
.hside{display:flex;flex-direction:column;gap:12px;min-height:0}.needc{overflow:auto;max-height:min(46vh,480px)}
.need{display:grid;grid-template-columns:26px 1fr;gap:0 8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}.need .n{grid-row:1/3;align-self:center;width:22px;height:22px;font-size:12px}.need b{color:#fff}.need em{grid-column:2;font-style:normal;color:var(--warn);font-size:12px}.need:hover b{color:var(--acc)}
.none{color:var(--dim);font-size:12.5px;padding:6px 0}
.bt{display:block;border:1px solid var(--line2);border-radius:18px;padding:8px 12px;text-align:center;font-weight:600;font-size:13px;margin-top:6px;background:none;width:100%}.bt.pri{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#1E1005;border:0}
.stripc{margin-top:12px;background:none;border-color:#1E2830}.stripc h2{color:#C9D2DA}.hint{transition:opacity .8s}.hint.gone{opacity:0}
.strip{position:relative;height:138px;margin:2px 24px 0}.band{position:absolute;left:0;right:0;bottom:26px;height:12px;border-radius:6px;background:linear-gradient(90deg,#7A4A22,#FFB45A 55%,#FFE9B8);opacity:.8}
.strip>span{position:absolute;bottom:4px;transform:translateX(-50%);font-size:11px;color:var(--dim)}
.mk{position:absolute;bottom:38px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0}
.mk em{font-style:normal;font-size:10.5px;color:var(--dim);white-space:nowrap;margin-bottom:3px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.mk b{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:2px solid var(--acc);color:var(--acc);font-size:11px;display:flex;align-items:center;justify-content:center;transition:transform .18s,box-shadow .18s}
.mk u{display:block;width:1px;height:var(--h);background:rgba(255,255,255,.4)}
.mk:hover{z-index:9}.mk:hover b,.mk:focus-visible b{transform:scale(1.28);box-shadow:0 0 18px 3px var(--acc)}.mk:hover em{color:#fff}
.tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--acc);border-radius:9px;padding:8px 10px;z-index:8;min-width:170px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.6);text-align:left}
.tip strong{display:block;color:#fff;font-size:12.5px;margin-bottom:3px;white-space:nowrap}.tip span{display:flex;justify-content:space-between;gap:14px;color:#C9D2DA;white-space:nowrap}.tip span i{color:var(--acc);font-style:normal}.tip small{display:block;margin-top:4px;color:var(--dim);border-top:1px solid var(--line);padding-top:3px;font-size:11px}
.mk:hover .tip,.mk:focus-visible .tip{display:block}
.board{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:8px;overflow-x:auto}.bcol{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:8px;min-height:300px}
.bh{display:flex;align-items:center;gap:6px;margin-bottom:8px}.bh .n{width:28px;height:28px;font-size:15px}.bh span{color:var(--dim);font-size:12px}
.bc{display:block;background:var(--panel2);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;border-left:4px solid transparent}.bc b{display:block;font-size:11px;color:var(--dim)}.bc:hover{outline:1px solid var(--acc)}
.bc.need2{border-left-color:var(--red);background:var(--warnbg)}.bc ul{margin:4px 0 0;padding-left:15px;color:var(--warn);font-size:11.5px}.bc .tag{display:inline-block;font-size:10.5px;color:var(--dim);border:1px solid var(--line2);border-radius:8px;padding:0 6px;margin-top:3px}
.bcnone{border:1px dashed var(--line2);color:var(--dim);text-align:center;border-radius:8px;padding:7px;font-size:12px}
.wnote{font-size:12px;color:var(--dim);margin:10px 2px 0}.foot{margin-top:18px;font-size:11.5px;color:var(--dim)}
.soonp{max-width:560px}.soonp p{color:var(--dim)}
@media (max-width:900px){.homeg{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:6px}.rail img{margin:0 6px 0 0;width:34px}.rail .sp{display:none}.figs{margin-left:0}}
@media (prefers-reduced-motion:reduce){.mk b,.hint{transition:none}}
/* hover card on the home map */
.mcard{position:absolute;z-index:4;pointer-events:none;background:rgba(11,15,18,.96);border:1px solid var(--acc);border-radius:10px;padding:9px 11px;min-width:210px;max-width:300px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.mcard strong{display:block;font-size:14px;color:#fff}.mcard small{display:block;color:var(--dim);margin-bottom:5px}.mcard span{display:flex;gap:6px;align-items:center;color:#DDE3E8;padding:1px 0}.mcard .n{width:17px;height:17px;font-size:10px}.mcard em{display:block;font-style:normal;color:var(--warn);margin-top:4px}.mcard u{display:block;text-decoration:none;color:var(--acc);font-size:11px;margin-top:4px}
.bc .tag{margin-right:4px}.bc .tags{display:block}
/* application sheet */
.top .bk{color:var(--acc);font-weight:600}.cbtn{border:1px solid var(--line2);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--ink)}.cbtn:hover{border-color:var(--acc)}
.sheet{display:grid;grid-template-columns:190px minmax(0,1fr) minmax(340px,30%);gap:12px;align-items:start}
.srail{display:flex;flex-direction:column;gap:6px;position:sticky;top:10px}.rs{display:grid;grid-template-columns:34px 1fr;gap:0 8px;align-items:center;padding:8px 9px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}.rs b{color:var(--ink)}.rs span{grid-column:2;font-size:11.5px}.rs .n{grid-row:1/3;width:30px;height:30px;font-size:16px}
.rs.todo .n{background:none;border:2px solid var(--c);color:var(--c)}.rs.now{border-color:var(--c)}.rs.now span{color:#FFD9A8;font-weight:700}.rs.view{background:color-mix(in srgb,var(--c) 24%,transparent);border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}.rs:hover{border-color:var(--c)}
.smid{background:#F7F3EE;color:#1E1712;border-radius:12px;padding:12px 14px;min-width:0}.sh{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--c);margin-bottom:6px}.sh .n{width:34px;height:34px;font-size:18px}.sh>div{flex:1}.sh b{display:block;font-size:17px}.sh span{font-size:12px;color:#6B5D52}
.nav2{font-size:12px;font-weight:600;border:1.5px solid #C9BFB5;border-radius:14px;padding:3px 10px;color:#1E1712}.nav2.fw{border-color:#2A1A10}
.smid h3{margin:12px 0 2px;font-size:12px;color:#6B5D52}.count{font-size:11.5px;color:#6B5D52;margin:4px 2px}
.row{display:grid;grid-template-columns:minmax(150px,240px) minmax(120px,1fr) minmax(0,1.1fr);gap:10px;align-items:baseline;padding:6px 8px;border-bottom:1px solid #E0D5CA}.row label{font-weight:600}.row b{font-weight:600;overflow-wrap:anywhere}.row.empty b{color:#A99C91;font-weight:400}.row em{font-style:normal;font-size:11.5px;color:#6B5D52}.row em a{color:#B4500F;font-weight:700;text-decoration:underline}
.docbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}.docb{flex:1;min-width:260px;display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid #2A1A10;border-radius:10px;padding:7px 10px}.docb>div{flex:1}.docb b{display:block;font-size:14px}.docb span{font-size:11.5px;color:#6B5D52}
.pbtn{border:0;border-radius:14px;padding:6px 12px;font-weight:700;font-size:12px;background:#2A1A10;color:#FFB45A}.pbtn:disabled{opacity:.45;cursor:not-allowed}
.showall{display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600;margin:8px 2px 0}.showall input{width:16px;height:16px;accent-color:#E8742E}
.flags p{display:flex;gap:7px;align-items:flex-start;margin:6px 0;padding:6px 9px;border-radius:8px;font-size:12.5px}.flags svg{flex:none}.flags .fr{background:#FFE4DC;color:#7A1F0C}.flags .fn{background:#E6EEF4;color:#1F3A4E}
.needbox{background:#FFF1EC;border-left:4px solid #C2410C;border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0;font-size:12.5px}.needbox ul{margin:3px 0 0;padding-left:18px}.perr{color:#8A1515}.none2{color:#6B5D52;font-size:12.5px}
.sctx{display:flex;flex-direction:column;gap:10px;min-width:0}.sctx table{border-collapse:collapse;width:100%}.sctx td,.sctx th{padding:3px 6px;font-size:12px;text-align:right;border-top:1px solid var(--line)}.sctx th{color:var(--dim);font-weight:600;border:0}.sctx td:first-child,.sctx th:first-child{text-align:left;font-weight:700}
.mis{color:var(--warn);font-weight:700}.ty{font-style:normal;font-size:10px;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:0 4px;font-weight:600}
.smap{height:380px;border-radius:8px;overflow:hidden;background:#0E1611}.smap.big{height:680px}.smap arcgis-map{display:block;width:100%;height:100%}.smap .none{padding:10px}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;font-size:11.5px;text-decoration:underline;padding:0}
.pp{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--panel2);margin-bottom:5px;font-size:12px}.pp small{display:block;color:var(--dim);font-size:11px}
@media (max-width:1100px){.sheet{grid-template-columns:1fr}.srail{position:static;flex-direction:row;flex-wrap:wrap}.rs{flex:1;min-width:140px}}
/* document preview (same dialog as the classic view) */
#prDlg{width:min(980px,96vw);height:94vh;max-height:94vh;border:1px solid #6B747E;border-radius:8px;padding:0;color:#1A1D21;background:#fff;font:inherit}#prDlg::backdrop{background:rgba(0,0,0,.6)}
#prDlg .prwrap{display:flex;flex-direction:column;height:100%}#prDlg .prhead{padding:10px 16px;border-bottom:1px solid #C9CED4}#prDlg .prhead b{font-size:16px}
#prDlg .prmiss{margin-top:6px;background:#FBE4E4;color:#8A1515;border-radius:4px;padding:6px 10px;font-size:13.5px}#prDlg iframe{flex:1;border:0;background:#8A9199;width:100%}
#prDlg .prfoot{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid #C9CED4}#prDlg .prfoot .sp{flex:1;font-size:13px;color:#4A525B}
#prDlg .btn{height:38px;padding:0 14px;border:1.5px solid #2A1A10;border-radius:19px;background:#fff;color:#1A1D21;font-weight:600}#prDlg .btn.go{background:#2A1A10;color:#FFB45A}
.edbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}.edbar .showall{margin:0}.locknote{font-size:12px;color:#6B5D52}
.savenote{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13px}.savenote.ok{background:#E3F1EA;color:#14532D;border-left:4px solid #1B8A5A}.savenote.bad{background:#FFE4DC;color:#7A1F0C;border-left:4px solid #C2410C}
/* fields grid */
.rs.fl{margin-top:8px;grid-template-columns:34px 1fr}.rs.fl .gi{grid-row:1/3;width:30px;height:30px;border-radius:8px;border:2px solid var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700}
.rs.fl.view{background:rgba(255,180,90,.16);border-color:var(--acc)}
.fgrid{border-collapse:collapse;width:100%;margin-top:6px}.fgrid th{font-size:11.5px;color:#6B5D52;text-align:left;padding:5px 6px;font-weight:600}.fgrid td{padding:7px 6px;border-top:1px solid #E0D5CA;font-size:13px;vertical-align:middle}
.fgrid td.fn{font-weight:700}.fgrid .mis{color:#C2410C}.fgrid tr.dim td{opacity:.35}.fgrid tr.sel td{background:#FFE9CF;border-top:2px solid #E8742E;border-bottom:2px solid #E8742E}.fgrid tr.sel td:first-child{border-left:2px solid #E8742E}.fgrid tr.sel td:last-child{border-right:2px solid #E8742E}

.gbar{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:#6B5D52}.fsum{display:flex;gap:18px;font-size:12.5px;margin:6px 2px;color:#6B5D52}.fsum b{color:#1E1712}
.edzone.joined.ed{border:2px solid #E8742E;border-radius:0 12px 12px 12px;padding:10px 12px;background:#FFF9EF;margin-top:-2px}
.dbtn{border:1px solid #7A3328;border-radius:13px;padding:3px 10px;font-weight:600;font-size:12px;color:#FF9C8A;background:none}
.sctx .lnk2{color:var(--acc);font-weight:600;font-size:11.5px;text-decoration:underline}
.fgrid td:last-child{white-space:nowrap}

#newapp[data-step="2"] #naMap,#newapp[data-step="2"] #naMapNote,#newapp[data-step="2"] #naAddRow,#newapp[data-step="2"] .ecard[data-st="Fields"] .ebody>.small:first-child{display:none !important}

.fynote{border:1px solid var(--acc);border-radius:13px;padding:3px 11px;background:rgba(255,180,90,.14);color:var(--acc);font-size:12px;font-weight:600}

/* ---- the classic app's own stylesheet, scoped to the editor inside the application page (generated by scope_css.py) ---- */

.edzone.ed .stabs{align-items: stretch;}
.edzone.ed .stbody{border-radius: 0 12px 12px 0;}
.edzone.ed .sttab[aria-selected="true"]{margin-right: -1px; border-right: 1px solid #fff;}
.edzone.ed .sttab:disabled{opacity: .45; cursor: not-allowed;}
.edzone.ed .sttab:disabled:hover{background: #E4ECEA; color: var(--muted);}
.edzone.ed .stbody details > summary{display: none;}
#naDlg .stbody details{border: 0; margin: 0; background: transparent;}
#naDlg .stabs{margin-top: 12px;}
#naDlg .stnav{flex-basis: 190px;}
#naDlg .stbody{min-height: 180px; padding: 12px 14px;}
#naDlg .stbody .nagridx{padding: 0;}
.edzone.ed #naGate{margin: 12px 0 0; font-weight: 600;}
.edzone.ed #naMapNote.error{font-weight: 600; margin: 8px 0;}
.edzone.ed details.closedList{background: var(--closed-bg); border: 0; padding: 0 0 2px; border-radius: 8px;}
.edzone.ed details.closedList[open]{padding-bottom: 10px;}
.edzone.ed details.closedList > summary{background: var(--s6); color: #fff; border-radius: 8px; padding: 6px 10px; min-height: 0; font-size: inherit;}
.edzone.ed details.closedList .item{margin: 8px 8px 0; background: #fff; border-color: var(--closed-line);}
.edzone.ed details.closedList .none{display: block; padding: 8px 10px 0;}
.edzone.ed details.closedList .item[aria-current="true"]{background: var(--closed-bg); border-color: var(--s6); box-shadow: none;}
@media (max-width: 860px){.edzone.ed .stbody{border-radius: 12px;}
.edzone.ed .sttab[aria-selected="true"]{border-right: 1px solid var(--line);}}
.edzone.ed .guide{background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 26px 34px 30px; max-width: 900px; line-height: 1.5;}
.edzone.ed .guide .ghead{display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;}
.edzone.ed .guide h1{margin: 0; font-size: 34px;}
.edzone.ed .guide .lead{margin: 2px 0 0; color: var(--muted); font-weight: 600;}
.edzone.ed .guide h2{font-size: 22px; margin: 26px 0 8px; padding-top: 14px; border-top: 2px solid var(--soft);}
.edzone.ed .guide p{margin: 0 0 10px; max-width: 72ch;}
.edzone.ed .guide ol,.edzone.ed .guide ul{margin: 0 0 10px; padding-left: 22px; max-width: 74ch;}
.edzone.ed .guide li{margin-bottom: 6px;}
.edzone.ed .guide table.gt{min-width: 0; width: 100%; border-collapse: collapse; margin: 0 0 12px;}
.edzone.ed .guide table.gt th{text-align: left; vertical-align: top; width: 120px; padding: 8px 12px 8px 0; font-weight: 700; border-top: 1px solid var(--soft);}
.edzone.ed .guide table.gt td{padding: 8px 0; border-top: 1px solid var(--soft);}
.edzone.ed .guide table.gt th{font-size: inherit; color: var(--ink); border-bottom: 0; background: none; text-transform: none; letter-spacing: 0;}
.edzone.ed .gstages{display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px;}
.edzone.ed .gstages span{padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; color: #fff;}
.edzone.ed .gstages .s1{background: var(--s1);}
.edzone.ed .gstages .s2{background: var(--s2); color: var(--ink);}
.edzone.ed .gstages .s3{background: var(--s3); color: var(--ink);}
.edzone.ed .gstages .s4{background: var(--s4);}
.edzone.ed .gstages .s5{background: var(--s5);}
.edzone.ed .gstages .s6{background: var(--s6);}
.edzone.ed .guide .gnote{background: var(--blue-bg); border-radius: 8px; padding: 10px 14px; font-weight: 600;}
.edzone.ed .guide .gfoot{margin-top: 22px; color: var(--muted); font-size: 13px;}

.edzone.ed .basesw button{all: unset; cursor: pointer; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink);}
.edzone.ed .basesw button[aria-pressed="true"]{background: #14323A; color: #fff;}
.edzone.ed .basesw button:focus-visible{outline: 3px solid var(--amber); outline-offset: -3px;}

.edzone.ed .bkcard h2{margin: 0 0 4px; font-size: 20px;}
.edzone.ed .bkcard p{margin: 0 0 4px; max-width: 78ch;}
.edzone.ed .bkcard .bkact{display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: 360px; text-align: right;}
.edzone.ed #bkStatus.ok{color: #1E4D2B; font-weight: 600;}
.edzone.ed #bkStatus.bad{color: #A01818; font-weight: 600;}
.edzone.ed .bkdue{background: #FFF4D6; border: 1px solid #B77900; color: #4A3200; border-radius: 8px; padding: 12px 16px; font-size: 14px;}
.edzone.ed .bkdue a{color: inherit; font-weight: 700;}
.edzone.ed .tabs.compact .tl{display: none;}
.edzone.ed .tabs.compact .tab{flex: 1 0 44px; justify-content: center; padding: 0 6px;}
.edzone.ed .tabs.compact .tab svg{width: 22px; height: 22px;}
.edzone.ed .tabs.compact4 .tab{flex: 1 0 22%;}
/* ---- the Dashboard look on the classic editor: colours, type, buttons and boxes only. The editor's code and layout are unchanged. ---- */
.edzone.ed.ed{--ink:#1E1712;--muted:#6B5D52;--line:#D9CEC2;--soft:#EAE2D8;--bg:#F7F3EE;--blue:#2A1A10;--blue-bg:#FFF4E3;--teal-bg:#FFF4E3;--red:#C2410C;--red-bg:#FFF1EC;--s5:#E8742E;
  color:var(--ink);font:14px/1.45 "Public Sans","Segoe UI",system-ui,sans-serif;margin-top:8px}
.edzone.ed.ed .pane{padding:0;background:none;border:0;box-shadow:none}
.edzone.ed.ed h2{font:700 19px "Barlow Semi Condensed",sans-serif;margin:6px 0 8px;color:var(--ink)}
.edzone.ed.ed h3{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 8px}
.edzone.ed.ed .notice{background:#FFF4D6;border:0;border-left:4px solid #F0A202;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#4A3A12;margin:6px 0}
.edzone.ed.ed .error{background:#FFE4DC;border:0;border-left:4px solid #C2410C;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#7A1F0C;white-space:pre-wrap}
.edzone.ed.ed .okmsg{background:#E3F1EA;border:0;border-left:4px solid #1B8A5A;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#14532D}
/* side tabs */
.edzone.ed.ed .stabs{margin-top:8px}
.edzone.ed.ed .sttab{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-right:0;border-left:4px solid transparent;border-radius:10px 0 0 10px;background:var(--soft);color:var(--muted);font:600 13px "Public Sans",sans-serif}
.edzone.ed.ed .sttab:hover{background:#F1EAE1;color:var(--ink)}
.edzone.ed.ed .sttab[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700;border-left-color:#E8742E;border-right:1px solid #fff}
.edzone.ed.ed .sttab:focus-visible{outline:3px solid #E8742E;outline-offset:-3px}
.edzone.ed.ed .stmark{background:#C2410C;color:#fff}
.edzone.ed.ed .stbody{background:#fff;border:1px solid var(--line);border-radius:0 12px 12px 0;padding:12px 14px}
.edzone.ed.ed .ecard{background:none;border:0;box-shadow:none;padding:0;margin:0 0 6px}
.edzone.ed.ed .ecard.tint,.edzone.ed.ed .ecard[class*="tint"]{background:#FFF9EF;border-radius:10px;padding:10px}
/* boxes */
.edzone.ed.ed .fld label,.edzone.ed.ed .fld .lab{font-weight:600;font-size:13px;color:var(--ink);margin-bottom:3px}
.edzone.ed.ed .fld small,.edzone.ed.ed .small{font-size:11.5px;color:var(--muted)}
.edzone.ed.ed input[type=text],.edzone.ed.ed input[type=number],.edzone.ed.ed input[type=date],.edzone.ed.ed input[type=datetime-local],.edzone.ed.ed input:not([type]),.edzone.ed.ed select,.edzone.ed.ed textarea{
  min-height:36px;height:auto;border:1.5px solid #C9BFB5;border-radius:7px;padding:6px 9px;font:600 14px "Public Sans",sans-serif;background:#fff;color:var(--ink);box-shadow:none}
.edzone.ed.ed input:focus,.edzone.ed.ed select:focus,.edzone.ed.ed textarea:focus{outline:none;border-color:#E8742E;box-shadow:0 0 0 3px rgba(232,116,46,.25)}
.edzone.ed.ed input:disabled,.edzone.ed.ed select:disabled,.edzone.ed.ed textarea:disabled{background:#F1EAE1;color:var(--muted);border-style:dashed}
.edzone.ed.ed .missing,.edzone.ed.ed input.missing,.edzone.ed.ed select.missing,.edzone.ed.ed textarea.missing{border-color:#C2410C;background:#FFF1EC}
.edzone.ed.ed .req{color:#C2410C}
.edzone.ed.ed .cval{font-weight:700;color:var(--muted)}
/* Yes / No and other choices as joined buttons */
.edzone.ed.ed .opts{display:inline-flex;flex-wrap:wrap;gap:0;border:1.5px solid #B9ADA2;border-radius:8px;overflow:hidden;background:#fff;padding:0}
.edzone.ed.ed .opts label{display:flex;align-items:center;margin:0;padding:6px 14px;font-weight:700;font-size:13px;color:#8A7D72;border-left:1px solid #E0D5CA;cursor:pointer;position:relative}
.edzone.ed.ed .opts label:first-child{border-left:0}
.edzone.ed.ed .opts label input{position:absolute;opacity:0;width:1px;height:1px}
.edzone.ed.ed .opts label:has(input:checked){background:#E8742E;color:#fff}
.edzone.ed.ed .opts label:has(input:focus-visible){outline:3px solid #2A1A10;outline-offset:-3px}
.edzone.ed.ed .opts label:has(input:disabled){cursor:not-allowed;opacity:.6}
.edzone.ed.ed .opts label.clr{font-weight:600;color:#B4500F;background:#FFF9EF}
.edzone.ed.ed .opts.missing{border-color:#C2410C;box-shadow:0 0 0 3px rgba(194,65,12,.2);background:#fff}
.edzone.ed.ed .sw input{accent-color:#E8742E;width:18px;height:18px}
/* the changes bar, and the buttons */
.edzone.ed.ed .edBtns{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:#2A1A10;color:#FFC48A;border:0;font-size:12.5px}
.edzone.ed.ed .edBtns>span{flex:1;color:#FFC48A}
.edzone.ed.ed .btn{height:36px;min-height:0;padding:0 16px;border-radius:18px;border:1.5px solid #FFC48A;background:none;color:#FFE9CF;font:700 13px "Public Sans",sans-serif;cursor:pointer}
.edzone.ed.ed .btn.go{border:0;background:linear-gradient(180deg,#FFC043,#FF8A1F);color:#1E1005}
.edzone.ed.ed .btn:disabled{opacity:.45;cursor:not-allowed}
.edzone.ed.ed .btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* review panel */
.edzone.ed.ed .review{background:#fff;border:2px solid #2A1A10;border-radius:12px;padding:12px 14px;margin-top:10px}
.edzone.ed.ed .review h3{font:700 17px "Barlow Semi Condensed",sans-serif;color:var(--ink);margin:0 0 8px}
.edzone.ed.ed .review>div>b{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.edzone.ed.ed .review ul{margin:3px 0 0;padding-left:18px}.edzone.ed.ed .review li{padding:2px 0;font-weight:600}
.edzone.ed.ed details.diag{margin-top:10px;font-size:11.5px;color:var(--muted)}.edzone.ed.ed details.diag pre{font-size:11px;white-space:pre-wrap}
.edzone.ed.ed a{color:#B4500F}

/* fixes after the first live look (18 Nov): choices always side by side; a long changes line wraps instead of pushing the buttons out */
.edzone.ed.ed .opts,.edzone.ed.ed .opts.inline{flex-direction:row;align-items:stretch;width:auto;max-width:100%}
.edzone.ed.ed .opts label{width:auto;min-height:0;white-space:nowrap}
.edzone.ed.ed .edBtns{flex-wrap:wrap}.edzone.ed.ed .edBtns>span{flex:1 1 320px;min-width:0}
/* panels for adding and deleting (same code as the classic view) */
.edzone.ed.ed .tool{background:#fff;border:2px solid #2A1A10;border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink)}
.edzone.ed.ed .tool.del{background:#FFF1EC;border-color:#C2410C}
.edzone.ed.ed .tool h3{font:700 17px "Barlow Semi Condensed",sans-serif;color:var(--ink);margin:0 0 6px}
.edzone.ed.ed .tool .frow{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.edzone.ed.ed .tool .frow label{display:block;font-weight:600;font-size:13px;margin-bottom:3px}
.edzone.ed.ed .tool .btn{border-color:#2A1A10;color:#2A1A10;margin-right:8px}.edzone.ed.ed .tool .btn.go{color:#1E1005}
.edzone.ed.ed .tool .btn.del,.edzone.ed.ed .btn.del{background:#C2410C;border:0;color:#fff}
.edzone.ed.ed .tool .err{color:#8A1515;font-weight:600}
/* New application page and its field panel */
.edzone.ed.ed .nabar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:10px;background:#2A1A10;color:#FFC48A;font-size:12.5px}.edzone.ed.ed .nabar .sp{flex:1 1 280px}
.edzone.ed.ed .linkbtn{color:#FFC48A;background:none;border:0;text-decoration:underline;font:inherit;cursor:pointer}
#naDlg.edzone{--ink:#1E1712;--muted:#6B5D52;--line:#D9CEC2;--red:#C2410C;border:2px solid #E8742E;border-radius:12px;background:#F7F3EE;color:#1E1712;font:14px/1.45 "Public Sans","Segoe UI",system-ui,sans-serif}
#naDlg.edzone .ndhead{font:700 18px "Barlow Semi Condensed",sans-serif;border-bottom:1px solid #D9CEC2}#naDlg.edzone .ndfoot{border-top:1px solid #D9CEC2;background:#2A1A10;color:#FFC48A;border-radius:0 0 10px 10px}
#naDlg.edzone .ndtop{background:#FFF4E3;border:1px solid #F0C98A;border-radius:10px}
#naDlg.edzone input,#naDlg.edzone select{height:36px;border:1.5px solid #C9BFB5;border-radius:7px;font:600 14px "Public Sans",sans-serif;background:#fff;color:#1E1712}
#naDlg.edzone input:focus,#naDlg.edzone select:focus{outline:none;border-color:#E8742E;box-shadow:0 0 0 3px rgba(232,116,46,.25)}
#naDlg.edzone .btn.danger{background:none;color:#FF9C8A;border-color:#FF9C8A}
#naDlg.edzone .ndwarn{background:#C2410C;border-radius:8px}
/* the changes bar stays in view at the bottom of the window while a long form scrolls (stage edit, field edit); the review panel's own bar does not need it */
.edzone.ed.ed .pane>.edBtns{position:sticky;bottom:8px;z-index:5;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
  </style>

  // ---- clicks on the Explore pages: a click selects, sorts or clears; only an "open in Stages" link opens an application ----
  const xTab = () => ((location.hash.split("/")[1] || "") === "explore" ? (location.hash.split("/")[2] || "farms") : "");

    const far = el.closest("[data-xfarm]"); if (far) { XS.farm = XS.farm === far.dataset.xfarm ? null : far.dataset.xfarm; xFarms(); return true; }
    const fr2 = el.closest("[data-xfrow]"); if (fr2) { XS.frow = XS.frow === fr2.dataset.xfrow ? null : fr2.dataset.xfrow; xFields(); return true; }
    const rs2 = el.closest("[data-xrsel]"); if (rs2) { XS.rsel = XS.rsel === rs2.dataset.xrsel ? null : rs2.dataset.xrsel; xRank(); return true; }

  document.addEventListener("click", (e) => {
    const tab = xTab(); if (!tab) return; const t = e.target;
    if (t.closest("a[href]")) return;                                            // links (open in Stages, the tabs, the menu) do their own thing
    if (t.closest("[data-xclear]")) { if (tab === "fields") { if (XS.frow && t.closest(".selbar")) XS.frow = null; else { XS.fsel = null; XS.frow = null; } xFields(); } else if (tab === "rank") { XS.rsel = null; xRank(); } else { XS.farm = null; closePop(); xFarms(); } return; }

    const s1 = t.closest("[data-xfarmsort]"); if (s1) { const k = s1.dataset.xfarmsort; XS.farmSort = [k, XS.farmSort[0] === k ? -XS.farmSort[1] : (k === "name" ? 1 : -1)]; xFarms(); return; }

    const s3 = t.closest("[data-xrsort]"); if (s3) { const k = s3.dataset.xrsort; XS.rsort = [k, XS.rsort[0] === k ? -XS.rsort[1] : (k === "name" ? 1 : -1)]; xRank(); return; }
    if (t.closest("#fPop")) return;

  const helpText = (h) => [h.t, h.intro, ...(h.steps || []).flat(), h.tip, ...(h.table || []).flat()].map((s) => String(s || "").replace(/<[^>]+>/g, " ")).join(" ").toLowerCase();
  const helpTable = (h, cls) => (h.table ? '<table class="' + cls + '"><tbody>' + h.table.map((r, i) => "<tr>" + r.map((c, j) => (i === 0 || j === 0 ? "<th>" : "<td>") + c + (i === 0 || j === 0 ? "</th>" : "</td>")).join("") + "</tr>").join("") + "</tbody></table>" : "");

  // =====================================================================================================================
  // Piece 6, second part (D8a): files on the application page, Backup, Delete application at any stage, Data check, Help.
  // The file list with Attach / Delete / Open (initDocs and its handlers) and the backup download are the classic code,
  // copied unchanged; this part only gives them a place on the page.
  // =====================================================================================================================
  // ---- Backup: the classic card (one node), shown wherever a page asks for it and parked again before the page is redrawn ----
  function bkPark() { const c = $("bkCard"), h = $("bkHold"); if (c && h && c.parentElement !== h) h.appendChild(c); }
  function bkShow(host) { const c = $("bkCard"); if (!c || !host) return; host.appendChild(c); try { bkDraw(); } catch (e) { console.warn("backup card", e); } }
  const bkFresh = () => { const t = bkWhen(); return !!t && Date.now() - t < 3600000; };

  // ---- Delete application, at any stage, closed ones included (Yasser, 18 Nov): a backup downloaded on this computer within the last hour is
  // required first; then the classic panel (what will be removed, the AEP ID typed, delete, read back). The classic rule "only before a decision"
  // is replaced here, on purpose, by "only after a backup"; view-only records still cannot be deleted. The classic app keeps its own rule.
  deletable = (r) => !!r && !r.viewOnly && bkFresh();      // eslint-disable-line no-func-assign
  function gateDraw() {
    const g = $("delGate"), r = rows.find((x) => x.id === curId); if (!g) return; bkPark();
    if (!gateDraw.on || !r) { g.innerHTML = ""; return; }
    g.innerHTML = '<div class="tool del gate"><h3>Delete application ' + esc(r.id) + '</h3><p><b>Step 1 of 2 · download a backup first.</b> Deleting removes the application, its field rows and its attached files for every app and for Survey123, and it cannot be undone. ' +
      (r.closed ? "This application is closed: its record of what was approved and paid goes with it. " : "") + 'The backup is the only way back, so a backup downloaded on this computer within the last hour is required.</p><div id="gateBk"></div>' +
      '<div class="tbar"><button type="button" class="btn" id="gateGo"' + (bkFresh() ? "" : " disabled") + '>Step 2 · continue to the delete confirmation</button><button type="button" class="btn" id="gateNo">Cancel</button><span class="small">' + (bkFresh() ? "A backup was downloaded within the last hour." : "Waiting for the backup download.") + "</span></div></div>";
    bkShow($("gateBk"));
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("#appDel") && !bkFresh()) { e.stopPropagation(); e.preventDefault(); if (ed || (tool && tool.busy)) return; gateDraw.on = true; gateDraw(); const g = $("delGate"); if (g) g.scrollIntoView({ block: "nearest" }); return; }
    if (e.target.id === "gateNo") { gateDraw.on = false; gateDraw(); return; }
    if (e.target.id === "gateGo" && bkFresh()) { gateDraw.on = false; gateDraw(); const b = $("appDel"); if (b) b.click(); }
  }, true);
  try { new MutationObserver(() => { if (gateDraw.on && $("delGate") && bkFresh() && $("gateGo") && $("gateGo").disabled) gateDraw(); }).observe($("bkStatus"), { childList: true, characterData: true, subtree: true, attributes: true }); } catch (e) { console.warn("backup watch", e); }

  // ---- Files of an application: the classic Documents list (Attach per group, Delete, Open; PDF only; also on closed applications) ----
  const filesLink = (r, on) => '<a class="rs fl' + (on ? " view" : "") + '" href="#/app/' + encodeURIComponent(r.id) + '/files"><i class="gi">▤</i><b>Files</b><span>attach, open, delete</span></a>';
  function filesHtml(m) {
    const r = m.r, e = esc, cls = (j) => (j < m.d ? "done" : j === m.d ? "now" : "todo");
    const rail = STAGES.map((st, i) => '<a class="rs ' + cls(i + 1) + '" style="--c:' + SCOL[i] + '" href="#/app/' + encodeURIComponent(r.id) + "/" + (i + 1) + '">' + sn(i + 1) + "<b>" + e(st) + "</b></a>").join("");
    return '<div class="top"><a class="bk" href="#/app/' + encodeURIComponent(r.id) + '">‹ back to the stages</a><h1>Files · ' + e(r.id) + " · " + e(r.applicant || "(no name)") + '</h1><span class="sub">' + e(r.fy) + "</span></div>" +
      '<div class="sheet two"><nav class="srail" aria-label="Stages of this application">' + rail + gridLink(r, false) + filesLink(r, true) + "</nav>" +
      '<section class="smid" style="--c:#E8742E"><div class="sh"><i class="n" style="--c:#E8742E">▤</i><div><b>Attached files</b><span>PDF only · each attach or delete is confirmed first, then read back</span></div></div>' +
      '<div class="edzone ed"><div class="pane docs"><div id="docStatus" class="notice">Reading the attached files…</div><div id="docNote"></div><div id="docReview"></div><input type="file" id="docPick" accept="application/pdf,.pdf" hidden><div id="docBody"></div>' +
      "<p>" + (canFiles(r) ? "PDF files can be attached, and files deleted, each after a confirmation" + (r.closed ? "; this also works on a closed application, whose values stay locked. " : ". ") : lockWhy(r) + " ") + 'Files are fetched by the app when you click Open. The four documents (summary, letter, agreement, cost form) are made on their stages or under Reports and are never attached automatically.</p>' +
      '<details class="diag"><summary>Document diagnostics (for support)</summary><pre id="docDiag" style="white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;margin:0"></pre></details></div></div></section></div>' + footHtml();
  }

  // ---- Data check: for the administrator (the owner of the web map) only ----
  const isAdmin = () => { try { return !!(webmap.portalItem && webmap.portalItem.owner && webmap.portalItem.owner === portalRef.user.username); } catch { return false; } };
  async function renderCheck() {
    if (!isAdmin()) { $("page").innerHTML = topHtml("Data check", "for the administrator", []) + '<div class="cx soonp"><p>This page is for the administrator of the app.</p><a class="bt" href="#/">Home</a></div>' + footHtml(); return; }
    $("page").innerHTML = topHtml("Data check", "for the administrator · read-only", []) + '<div class="cx soonp"><p>Checking…</p></div>' + footHtml();
    let polyErr = ""; try { await loadPolygons(); } catch (e) { polyErr = mask(e.message || e); }
    let bornTxt = "not read"; try { const f = await bornLoad(); bornTxt = f && f.hash ? "read · hash " + f.hash + (f.formVersionUsed ? " · " + f.formVersionUsed : "") : "read"; } catch (e) { bornTxt = "NOT READ (" + mask(e.message || e) + ")"; }
    if ((location.hash.split("/")[1] || "") !== "check") return;
    const farmSet = new Set((MAPS.farms || []).map((f) => f.farm)), fieldSet = new Set((MAPS.fields || []).map((f) => f.farm + "|" + f.key)), gids = new Set(rows.map((r) => normId(r.gid)).filter(Boolean));
    const noFarm = [], noPoly = [], noFields = [], offMap = [], idCount = new Map();
    for (const m of MODELS) { const fno = F.farmNo ? normFarm(m.r.a[F.farmNo]) : ""; idCount.set(m.r.id, (idCount.get(m.r.id) || 0) + 1);
      if (!fno) noFarm.push(m.r.id); else if (!polyErr && !farmSet.has(fno)) noPoly.push(m.r.id + " (Farm # " + m.r.a[F.farmNo] + ")");
      if (!fieldsOf(m.r).length) noFields.push(m.r.id);
      if (fno && !polyErr) for (const x of fieldsOf(m.r)) if (!fieldSet.has(fno + "|" + normKey(attr(x, "FieldNum")))) offMap.push(m.r.id + " field " + (attr(x, "FieldNum") ?? "?")); }
    const orphans = (fr.rows || []).filter((x) => !gids.has(normId(x[fr.parent]))).length, dups = [...idCount].filter(([, n]) => n > 1).map(([id, n]) => id + " ×" + n), needs = MODELS.filter((m) => m.need.length && m.d < 6);
    const line = (ok, title, list, okText) => '<div class="ck ' + (ok ? "ok" : "bad") + '"><i>' + (ok ? "✓" : "!") + "</i><div><b>" + esc(title) + "</b><span>" + (ok ? esc(okText) : esc(list.length + ": ") + list.slice(0, 40).map(esc).join(" · ") + (list.length > 40 ? " …" : "")) + "</span></div></div>";
    const info = (k, v) => "<div><dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd></div>", bt = bkWhen();
    $("page").innerHTML = topHtml("Data check", "for the administrator · read-only", [[String(rows.length), "applications"], [String((fr.rows || []).length), "field rows"]]) +
      '<div class="ckg"><div class="cx"><h2>Records</h2>' +
        line(!dups.length, "Every AEP ID is used once", dups, "no duplicates") +
        line(!noFarm.length, "Every application has a Farm #", noFarm, "all have one") +
        line(!noPoly.length, "Every Farm # is on the farms layer", noPoly, polyErr ? "not checked: the polygons could not be read" : "all found") +
        line(!noFields.length, "Every application has fields", noFields, "all have at least one") +
        line(!offMap.length, "Every field row is a field on the map", offMap, polyErr ? "not checked: the polygons could not be read" : "all found") +
        line(!orphans, "Every field row belongs to an application", [orphans + " field row(s) point at no application"], "no orphan rows") +
        line(!needs.length, "Nothing is waiting for input", needs.map((m) => m.r.id), "no open application lists a missing value") + "</div>" +
      '<div class="cx"><h2>What the page read</h2><dl class="ffacts">' + info("Layers", layerInfo) + info("Fields not found", missing.length ? missing.join("; ") + " (their checks are skipped)" : "none: every field this page uses was found") +
        info("Forms", TABS.filter((t) => t.layer).map((t) => t.label + (forms[t.key].error ? ": NOT READ (" + forms[t.key].error + ")" : ": " + forms[t.key].list.length + " fields" + (forms[t.key].noForm ? " (no form; all fields)" : ""))).join(" · ")) +
        info("Field rows", fr.rows ? fr.rows.length + " rows read" : "NOT READ (" + fr.error + ")") +
        info("Polygons", polyErr ? "NOT READ (" + polyErr + ")" : (MAPS.farms || []).length + " farms and " + (MAPS.fields || []).length + " fields, from " + (MAPS.source || "?")) +
        info("Survey rules file", "born-values.json: " + bornTxt) + info("Versions", "Dashboard " + D_BUILD + " · classic code " + (typeof BUILD === "string" ? BUILD : "?") + " · ArcGIS SDK " + sdkVer) +
        info("Signed in as", (portalRef && portalRef.user && portalRef.user.username) || "?") +
        info("Last backup here", bt ? new Date(bt).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }) : "none downloaded on this computer") + '</dl><div id="ckBk" class="edzone ed" style="margin-top:12px"></div></div></div>' + footHtml();
    bkShow($("ckBk"));
  }

  // ---- Help (pattern of the Watershed Monitoring app's Help page): search, topic list, the chosen topic on paper, words and About.
  // The topics (HELP, HELP_WORDS, helpText, helpTable) are in help_topics.js. UPDATE THEM WHENEVER A FEATURE CHANGES. ----
  const dhelp = { q: "" };                         // the search text survives page changes
  const helpList = () => HELP.filter((h) => !h.admin || isAdmin());
  function renderHelp() {
    const topics = helpList(), k = location.hash.split("/")[2] || "", i = Math.max(0, topics.findIndex((h) => h.k === k)), h = topics[i], nx = topics[i + 1];
    $("page").innerHTML = '<div class="top"><h1>Help</h1><span class="sub">Washington County Conservation District · Agricultural Enhancement Program</span></div>' +
      '<input class="dh-q" id="dhQ" type="search" placeholder="Search help (e.g. “backup”, “delete”, “pH”, “print”)" aria-label="Search help" value="' + esc(dhelp.q) + '">' +
      '<div class="dh-grid"><nav class="dh-list" aria-label="Help topics"><div id="dhList"></div><div class="cx dh-mail"><b>Questions or a problem?</b><p>Email the administrator. Include the AEP ID, what you clicked and the message on screen.</p><a href="mailto:yayad@pennwest.edu">✉ Email the administrator</a></div></nav>' +
      '<section class="dh-p"><h2>' + h.t + '</h2><div class="dh-intro">' + h.intro + "</div>" + h.steps.map(([a, b], j) => '<div class="dh-step"><i>' + (j + 1) + "</i><div><b>" + a + "</b><div>" + b + "</div></div></div>").join("") + helpTable(h, "dh-tbl") +
        (h.tip ? '<div class="dh-tip">' + h.tip + "</div>" : "") + (h.k === "backup" ? '<div id="helpBk" class="edzone ed" style="margin-top:14px"></div>' : "") +
        '<div class="dh-nav">' + (h.k === "backup" ? "" : '<a class="btnp" href="' + h.go[0] + '">' + h.go[1] + "</a>") + (nx ? '<a class="next" href="#/help/' + nx.k + '">Next: <u>' + nx.t + "</u> →</a>" : "") + "</div></section>" +
      '<aside class="dh-side"><div class="cx"><b>Words used in the app</b><dl>' + HELP_WORDS.map(([a, b]) => "<dt>" + a + "</dt><dd>" + b + "</dd>").join("") + '</dl></div><div class="cx"><b>About</b><p>WCCD lime applications · Dashboard view, build ' + D_BUILD + " (" + D_DATE + ").</p><p>Reads and saves the applications, their field rows and their attached files in the district's ArcGIS Online account. Scores and amounts follow the rules of the review forms.</p></div></aside></div>" + footHtml();
    const list = () => { const q = dhelp.q.trim().toLowerCase(), hits = topics.filter((x) => !q || helpText(x).includes(q));
      $("dhList").innerHTML = hits.length ? hits.map((x) => '<a class="dh-t' + (x === h ? " on" : "") + '" href="#/help/' + x.k + '">' + (topics.indexOf(x) + 1) + ". " + x.t + "</a>").join("") : '<div class="dh-none">No topic mentions “' + esc(dhelp.q) + "”.</div>"; };
    $("dhQ").oninput = (e) => { dhelp.q = e.target.value; list(); };          // only the list is redrawn, so the search box keeps its focus
    list(); bkShow($("helpBk")); window.scrollTo(0, 0);
  }

  // ---- A new application may be created before the lab results are in (Yasser, 19 Nov): a field's soil pH, lime recommendation and lab date are
  // no longer required to create. The classic check is asked first and those three are taken out of its "missing" list; everything else it
  // checks (field number, acres, impossible values) still blocks. The survey's own rules store such a field with 0 tons, and the application
  // then waits at 1 Intake until the values are entered. ----
  const SOIL_LATER = ["soil pH", "lime recommendation", "lab date"], classicNrProblems = nrProblems;
  nrProblems = (r) => { const p = classicNrProblems(r); return { miss: p.miss.filter((t) => !SOIL_LATER.includes(t)), bad: p.bad, later: p.miss.filter((t) => SOIL_LATER.includes(t)) }; };      // eslint-disable-line no-func-assign
  function soilLaterMarks() {
    try { const pane = $("naPane"); if (!pane || $("newapp").hidden || !NA || !NA.rows) return;
      const later = NA.rows.map((r) => nrProblems(r).later);
      pane.querySelectorAll(".nalist li").forEach((li, i) => { const st = li.querySelector(".st"); if (st && later[i] && later[i].length && st.classList.contains("ok") && !st.dataset.later) { st.dataset.later = "1"; st.className = "st wait"; st.textContent = "Can be created · still to enter: " + later[i].join(", "); } });
      const h = pane.querySelector("h2");
      if (h && /review/i.test(h.textContent) && !pane.querySelector("#soilLater") && later.some((l) => l.length)) {
        const uls = [...pane.querySelectorAll(".ebody > div")].find((d) => /^Fields \(/.test((d.querySelector("b") || {}).textContent || "")), lis = uls ? [...uls.querySelectorAll("ul > li")] : [];
        lis.forEach((li, i) => { const l = later[i] || []; if (!l.length) return; const num = (li.querySelector("b") || {}).textContent || "", t = li.textContent.replace(num, "");
          let out = t; if (l.includes("soil pH")) out = out.replace(/· pH (0|NaN) ·/, "· pH not entered ·"); if (l.includes("lime recommendation")) out = out.replace(/· (0|NaN) lb\/acre \((0|NaN) tons\/acre\) = 0 tons/, "· lime recommendation not entered"); if (l.includes("lab date")) out = out.replace(/· lab date[^·]*/, "· lab date not entered ");
          li.textContent = ""; const b = document.createElement("b"); b.textContent = num; li.append(b, document.createTextNode(out)); });
        const n = document.createElement("div"); n.id = "soilLater"; n.className = "soillater"; n.innerHTML = "<b>This application can be created now, and it will wait at 1 Intake.</b> It cannot be ranked until these are entered: " + NA.rows.map((r, i) => (later[i].length ? "field " + esc(r.num || "?") + " (" + esc(later[i].join(", ")) + ")" : "")).filter(Boolean).join("; ") + ".";
        (uls || pane).appendChild(n); }
    } catch (e) { console.warn("soil later marks", e); }
  }
  { let t = null; new MutationObserver(() => { clearTimeout(t); t = setTimeout(soilLaterMarks, 40); }).observe($("naPane"), { childList: true, subtree: true }); }

  // ---- routes ----
  function dRoute() {
    bkPark(); gateDraw.on = false;
    const h = location.hash.replace(/^#\/?/, "").split("/")[0] || "home"; HM = null;
    document.querySelector(".app").classList.toggle("landing", h === "home");
    if (tool && !tool.busy) tool = null;      // an add or delete panel never outlives the page it was opened on (as in the classic view)
    MODELS = rows.map(model);            // always from the applications as last read (they are re-read after every save, add or delete)
    document.querySelectorAll(".rail a[data-r]").forEach((a) => a.classList.toggle("on", a.dataset.r === (h === "app" ? "stages" : h)));
    if (h === "work") { history.replaceState(null, "", "#/app/" + (location.hash.split("/")[2] || "") + "/1"); return dRoute(); }      // where the copied create code sends the page afterwards
    $("newapp").hidden = h !== "new"; $("detail").hidden = h === "new";
    if (h === "new") { naOpen(); stepsDraw(); return; }
    if (h === "home") renderHome(); else if (h === "stages") renderStages(); else if (h === "app") renderSheet(); else if (h === "explore") renderExplore(); else if (h === "reports") renderReports(); else if (h === "check") renderCheck(); else if (h === "help") renderHelp(); else renderSoon({ explore: "Explore", reports: "Reports", check: "Data check", help: "Help" }[h] || "Page");
  }
  document.addEventListener("click", (e) => { if (e.target.id !== "fyAll") return; fyPick = "all"; try { sessionStorage.setItem("wccdDashFy", fyPick); } catch { /* ignore */ } dRoute(); });
  document.addEventListener("change", (e) => { if (e.target.id !== "fySel") return; fyPick = e.target.value; try { sessionStorage.setItem("wccdDashFy", fyPick); } catch { /* ignore */ } dRoute(); });
  // Data check is shown only to the administrator: the owner of the web map the app reads.
  // Check and Classic are for the administrator (the owner of the web map) only; nothing else on these pages leads to the classic view
  try { const adm = !!(webmap.portalItem && webmap.portalItem.owner && webmap.portalItem.owner === portalRef.user.username); $("navCheck").hidden = !adm; $("navClassic").hidden = !adm; } catch { $("navCheck").hidden = true; $("navClassic").hidden = true; }
  $("status").hidden = true;
  window.addEventListener("hashchange", dRoute);
  dRoute();
</script>
</body>
</html>
